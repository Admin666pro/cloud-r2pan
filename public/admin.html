<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-r2pan</title>
<style>
:root {
  --glass: rgba(255,255,255,.09);
  --glass-strong: rgba(255,255,255,.14);
  --stroke: rgba(255,255,255,.16);
  --stroke-strong: rgba(255,255,255,.28);
  --text: #fff;
  --text-2: rgba(255,255,255,.66);
  --text-3: rgba(255,255,255,.42);
  --blue: #0a84ff;
  --radius: 24px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  min-height: 100vh; color: var(--text); position: relative; overflow-x: hidden;
  background: linear-gradient(165deg, #0b1026 0%, #151238 42%, #26104a 100%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: rgba(10,132,255,.4); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }

/* ── 背景光斑 ─────────────────────────── */
.orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .45; pointer-events: none; animation: drift 22s ease-in-out infinite alternate; z-index: 0; }
.o1 { width: 52vmax; height: 52vmax; background: #22d3ee; top: -20%; left: -16%; }
.o2 { width: 44vmax; height: 44vmax; background: #7c5cf6; bottom: -22%; right: -12%; animation-delay: -8s; }
.o3 { width: 30vmax; height: 30vmax; background: #ec4899; top: 48%; left: 12%; animation-delay: -15s; opacity: .3; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(5vw,-6vh) scale(1.15); } }

/* ── 布局 ─────────────────────────────── */
#app { position: relative; z-index: 1; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 20px clamp(14px, 3vw, 28px) 60px; }

/* ── 玻璃卡片 ─────────────────────────── */
.glass {
  background: linear-gradient(150deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
  border: 1px solid var(--stroke-strong);
  border-radius: var(--radius);
  box-shadow: 0 16px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
}

/* ── 顶栏 ─────────────────────────────── */
.topbar {
  position: sticky; top: 12px; z-index: 50; margin-bottom: 22px;
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  background: linear-gradient(150deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--stroke-strong); border-radius: 22px;
  box-shadow: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
}
.logo { width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(150deg, #67e8f9, #3b82f6 55%, #8b5cf6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 16px rgba(59,130,246,.4); }
.logo svg { width: 22px; height: 22px; }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.topbar .sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.topbar .spacer { flex: 1; }
.traffic-pill {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 14px;
  background: rgba(255,255,255,.09); border: 1px solid var(--stroke);
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap;
  transition: background .2s;
}
.traffic-pill:hover { background: rgba(255,255,255,.15); }
.traffic-pill .bar { width: 52px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
.traffic-pill .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .5s cubic-bezier(.22,1,.36,1); }
.traffic-pill.danger .bar i { background: linear-gradient(90deg,#fbbf24,#ff453a); }
.traffic-pill.danger { color: #ffb3ae; }

/* ── 分段控制 ─────────────────────────── */
.seg {
  display: flex; gap: 4px; padding: 4px; margin-bottom: 22px; border-radius: 18px;
  background: rgba(255,255,255,.08); border: 1px solid var(--stroke);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  overflow-x: auto; scrollbar-width: none;
}
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 1; white-space: nowrap; padding: 9px 18px; border: none; border-radius: 14px;
  background: transparent; color: var(--text-2); font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .2s;
}
.seg button.active {
  color: #fff; background: rgba(255,255,255,.16);
  box-shadow: 0 4px 14px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);
}

/* ── 统计卡片 ─────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card { padding: 20px 22px; border-radius: 22px; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
.stat-card:nth-child(2){animation-delay:.05s}.stat-card:nth-child(3){animation-delay:.1s}.stat-card:nth-child(4){animation-delay:.15s}
.stat-card .label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.stat-card .value { margin-top: 8px; font-size: 27px; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-card .value small { font-size: 14px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
.progress { margin-top: 12px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .6s cubic-bezier(.22,1,.36,1); }
.progress.hot i { background: linear-gradient(90deg,#fbbf24,#ff453a); }
.stat-card .foot { margin-top: 8px; font-size: 12px; color: var(--text-3); }

/* ── 通用卡片区块 ─────────────────────── */
.section { padding: 22px; margin-bottom: 18px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.section-title h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }

/* ── 图表 ─────────────────────────────── */
.chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; min-width: 0; height: 100%; }
.chart .bar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, rgba(103,232,249,.95), rgba(59,130,246,.55));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4); transition: height .7s cubic-bezier(.22,1,.36,1); min-height: 3px; position: relative; }
.chart .bar:hover { background: linear-gradient(180deg, #67e8f9, #3b82f6); }
.chart .bar span { position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text-2); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.chart .bar:hover span { opacity: 1; }
.chart .day { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── 表格 ─────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; padding: 9px 10px; color: var(--text-3); font-weight: 600; font-size: 12px;
  border-bottom: 1px solid var(--stroke); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid rgba(255,255,255,.06); white-space: nowrap; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr { transition: background .15s; }
.tbl tbody tr:hover { background: rgba(255,255,255,.05); }
.tbl .num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 12.5px; }
.name-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
.empty .icon { font-size: 34px; margin-bottom: 10px; opacity: .7; }

/* ── 文件图标 ─────────────────────────── */
.ficon { width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; letter-spacing: -.02em;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18); vertical-align: middle; }

/* ── 按钮 ─────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border: 1px solid var(--stroke-strong); border-radius: 13px;
  background: rgba(255,255,255,.1); color: #fff; font-size: 13.5px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all .18s; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
}
.btn:hover { background: rgba(255,255,255,.17); transform: translateY(-1px); }
.btn:active { transform: scale(.96); }
.btn.primary { background: linear-gradient(180deg,#3d9bff,#0a7cff); border-color: transparent;
  box-shadow: 0 8px 22px rgba(10,124,255,.38), inset 0 1px 0 rgba(255,255,255,.35); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { background: rgba(255,69,58,.16); border-color: rgba(255,69,58,.4); color: #ffb3ae; }
.btn.danger:hover { background: rgba(255,69,58,.28); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }
.btn[disabled] { opacity: .4; pointer-events: none; }

/* ── 上传区 ───────────────────────────── */
.dropzone {
  margin-bottom: 18px; padding: 34px 20px; text-align: center; cursor: pointer;
  border: 1.5px dashed rgba(255,255,255,.28); border-radius: var(--radius);
  background: rgba(255,255,255,.045); transition: all .2s;
}
.dropzone:hover, .dropzone.over { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); transform: scale(1.005); }
.dropzone .icon { font-size: 34px; margin-bottom: 10px; }
.dropzone .t { font-size: 15px; font-weight: 650; }
.dropzone .d { margin-top: 6px; font-size: 12.5px; color: var(--text-3); }
.upload-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-top: 10px;
  border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid var(--stroke); font-size: 13.5px; }
.upload-item .prog { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.upload-item .prog i { display: block; height: 100%; width: 0; border-radius: 3px;
  background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .2s; }
.upload-item .pct { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }

/* ── 表单 ─────────────────────────────── */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 7px; }
.field input, .field select {
  width: 100%; padding: 12px 14px; border-radius: 14px; font-size: 15px; font-family: inherit;
  color: #fff; background: rgba(255,255,255,.09); border: 1px solid var(--stroke-strong); outline: none;
  transition: border .2s, background .2s; -webkit-appearance: none; appearance: none;
}
.field input:focus { border-color: rgba(10,132,255,.7); background: rgba(255,255,255,.13); }
.field input::placeholder { color: var(--text-3); }
.field .tip { margin-top: 6px; font-size: 12px; color: var(--text-3); line-height: 1.5; }

/* ── iOS 分组设置列表 ─────────────────── */
.group { border-radius: 22px; overflow: hidden; margin-bottom: 16px; }
.group .row {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.05);
}
.group .row:last-child { border-bottom: none; }
.group .row .info { flex: 1; min-width: 0; }
.group .row .info .t { font-size: 14.5px; font-weight: 600; }
.group .row .info .d { margin-top: 3px; font-size: 12.5px; color: var(--text-3); line-height: 1.5; }
.group .row input[type=number], .group .row input[type=text] {
  width: 110px; padding: 9px 12px; border-radius: 12px; font-size: 14.5px; font-family: inherit;
  color: #fff; background: rgba(255,255,255,.1); border: 1px solid var(--stroke-strong); outline: none; text-align: right;
  font-variant-numeric: tabular-nums;
}
.group .row input[type=number]:focus { border-color: rgba(10,132,255,.7); }
.group .row input[type=text] { width: 170px; text-align: left; }

/* iOS 开关 */
.switch { position: relative; width: 50px; height: 30px; flex: none; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .track { position: absolute; inset: 0; border-radius: 16px; background: rgba(255,255,255,.16); transition: background .25s; }
.switch .thumb { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35); transition: transform .25s cubic-bezier(.22,1.2,.36,1); }
.switch input:checked + .track { background: linear-gradient(180deg,#3d9bff,#0a7cff); }
.switch input:checked + .track .thumb { transform: translateX(20px); }

/* ── 模态框（底部弹层风格） ───────────── */
.modal-mask { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0,0,0,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  animation: fadeIn .25s both; }
@media (min-width: 640px) { .modal-mask { align-items: center; padding-bottom: 0; } }
.modal {
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  padding: 26px; border-radius: 32px 32px 0 0;
  background: linear-gradient(160deg, rgba(40,38,80,.92), rgba(24,22,52,.95));
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--stroke-strong); border-bottom: none;
  box-shadow: 0 -20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2);
  animation: sheetUp .4s cubic-bezier(.22,1.1,.36,1) both;
}
@media (min-width: 640px) { .modal { border-radius: 32px; border-bottom: 1px solid var(--stroke-strong); } }
@keyframes sheetUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
.modal .sub { font-size: 13px; color: var(--text-3); margin-bottom: 18px; }
.modal .actions { display: flex; gap: 10px; margin-top: 20px; }
.modal .actions .btn { flex: 1; padding: 13px; font-size: 15px; border-radius: 16px; }
.link-box { display: flex; gap: 8px; margin-top: 4px; }
.link-box input { flex: 1; padding: 12px 14px; border-radius: 14px; font-size: 14px;
  font-family: ui-monospace, "SF Mono", monospace; color: #a5d8ff;
  background: rgba(0,0,0,.3); border: 1px solid var(--stroke); outline: none; }

/* ── Toast ────────────────────────────── */
#toasts { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  padding: 11px 22px; border-radius: 16px; font-size: 14px; font-weight: 600; color: #fff;
  background: rgba(30,28,60,.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--stroke-strong); box-shadow: 0 12px 32px rgba(0,0,0,.45);
  animation: toastIn .35s cubic-bezier(.22,1.2,.36,1) both; max-width: 86vw; text-align: center;
}
.toast.ok { border-color: rgba(52,211,153,.5); }
.toast.err { border-color: rgba(255,69,58,.55); }
.toast.out { animation: toastOut .3s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-12px) scale(.94); } }

/* ── 分页 ─────────────────────────────── */
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
.pager .info { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── 状态徽章 ─────────────────────────── */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 9px; font-size: 11.5px; font-weight: 650; }
.tag.active { background: rgba(52,211,153,.16); color: #6ee7b7; }
.tag.expired { background: rgba(255,159,10,.16); color: #fcd34d; }
.tag.revoked { background: rgba(255,69,58,.16); color: #fda293; }
.tag.maxed { background: rgba(255,159,10,.16); color: #fcd34d; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── 警示横幅 ─────────────────────────── */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 15px 18px; margin-bottom: 18px;
  border-radius: 20px; background: rgba(255,159,10,.12); border: 1px solid rgba(255,159,10,.38); }
.banner .ic { font-size: 20px; line-height: 1.3; }
.banner .t { font-size: 14px; font-weight: 650; color: #ffd9a0; }
.banner .d { margin-top: 3px; font-size: 12.5px; color: rgba(255,217,160,.75); line-height: 1.55; }

/* ── 登录页 ───────────────────────────── */
#login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 1; }
.login-card { width: 100%; max-width: 380px; padding: 44px 34px 36px; text-align: center;
  border-radius: 36px; animation: fadeUp .6s cubic-bezier(.22,1.1,.36,1) both; }
.login-card .logo { width: 74px; height: 74px; border-radius: 24px; margin: 0 auto 20px; }
.login-card .logo svg { width: 40px; height: 40px; }
.login-card h1 { font-size: 23px; font-weight: 750; letter-spacing: -.03em; }
.login-card .sub { margin: 8px 0 26px; font-size: 13.5px; color: var(--text-3); }
.login-card input { width: 100%; padding: 15px 18px; border-radius: 18px; font-size: 16px; font-family: inherit;
  color: #fff; background: rgba(255,255,255,.09); border: 1px solid var(--stroke-strong); outline: none; text-align: center;
  transition: border .2s, background .2s; }
.login-card input:focus { border-color: rgba(10,132,255,.75); background: rgba(255,255,255,.13); }
.login-card .btn { width: 100%; margin-top: 14px; padding: 15px; font-size: 16px; border-radius: 18px; }
.login-card .err { margin-top: 12px; font-size: 13px; color: #fda293; min-height: 18px; }
.login-card .lang-row { margin-top: 18px; }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spin .8s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

.actions-cell { display: flex; gap: 6px; }
@media (max-width: 720px) {
  .tbl th:nth-child(n+5), .tbl td:nth-child(n+5) { display: none; }
  .topbar .sub { display: none; }
}
</style>
</head>

<div id="app"><div class="spin"></div></div>

<script>
/* ═══════════ i18n ═══════════ */
const I18N = {
  zh: {
    docTitle: '{site} · 管理后台',
    // 通用

    copied: '已复制到剪贴板', save: '保存设置', saved: '设置已保存', forever: '永久',
    switchTo: 'EN', topbarSub: '管理后台 · Cloudflare Workers + R2',

    loginSubtitle: '管理后台 · 请输入管理密钥登录', keyPlaceholder: '管理密钥 (admin)',

    tabOverview: '概览', tabFiles: '文件', tabShares: '分享', tabLogs: '记录', tabBans: '封禁', tabSecurity: '安全', tabSettings: '设置',
    // 概览
    statTraffic: '本月流量', usedPercent: '已用 {n}% · 跨月自动重置', noLimit: '未设置限额',
    statDownloads: '累计下载', todayN: '今日 {n} 次', statFiles: '文件总数', storedR2: '存储于 R2 对象存储',
    statShares: '分享链接', sharesFoot: '有效 {a} 个 · 封禁 IP {b} 个',

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

let LANG = detectLang();
const t = (key, params) => {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
};
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';

/* ═══════════ 工具函数 ═══════════ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtSize(n){
  n = Number(n)||0;
  if(n < 1024) return n + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { n /= 1024; i++; } while(n >= 1024 && i < u.length-1);
  return n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2) + ' ' + u[i];
}
function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(Number(ts)), p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const EXT_COLORS = {
  zip:'#ffb340',rar:'#ffb340','7z':'#ffb340',tar:'#ffb340',gz:'#ffb340',
  pdf:'#ff6961',doc:'#5b9cf5',docx:'#5b9cf5',txt:'#9aa4b2',md:'#9aa4b2',
  xls:'#3ecf8e',xlsx:'#3ecf8e',csv:'#3ecf8e',ppt:'#ff9f0a',pptx:'#ff9f0a',
  mp3:'#bf5af2',wav:'#bf5af2',flac:'#bf5af2',m4a:'#bf5af2',
  mp4:'#ff453a',mov:'#ff453a',mkv:'#ff453a',avi:'#ff453a',
  png:'#30d158',jpg:'#30d158',jpeg:'#30d158',gif:'#30d158',webp:'#30d158',svg:'#30d158',
  apk:'#3ecf8e',exe:'#9aa4b2',iso:'#9aa4b2',dmg:'#9aa4b2',default:'#8ea0c8'
};
const extOf = n => (/\.([a-z0-9]+)$/i.exec(n||'')||[])[1]?.toLowerCase() || '';
const extColor = n => EXT_COLORS[extOf(n)] || EXT_COLORS.default;
const ficon = name => `<span class="ficon" style="color:${extColor(name)}">${esc((extOf(name)||'?').toUpperCase().slice(0,4))}</span>`;

async function api(path, opts={}){
  const r = await fetch(path, { credentials:'same-origin', ...opts,
    headers: { ...(opts.body && !(opts.body instanceof FormData) ? {'content-type':'application/json'} : {}), ...(opts.headers||{}) } });
  let data = null;
  try { data = await r.json(); } catch {}
  if(r.status === 401 && !path.includes('/login')) { showLogin(); throw new Error('unauthorized'); }
  if(!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
  return data;
}

function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2600);
}

function copyText(text){
  if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => toast(t('copied')));
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove();
  return Promise.resolve(toast(t('copied')));
}

const confirmDialog = (title, msg, danger=true) => new Promise(resolve => {
  openModal(`
    <h3>${esc(title)}</h3>
    <div class="sub">${esc(msg)}</div>
    <div class="actions">
      <button class="btn" data-x>${esc(t('cancel'))}</button>
      <button class="btn ${danger?'danger':'primary'}" data-ok>${esc(t('confirm'))}</button>
    </div>`);
  $('[data-ok]').onclick = () => { closeModal(); resolve(true); };
  $('[data-x]').onclick = () => { closeModal(); resolve(false); };
});

function toggleLang(){
  try { localStorage.setItem('cd_lang', LANG === 'zh' ? 'en' : 'zh'); } catch {}
  location.reload();
}

/* ═══════════ 模态框 ═══════════ */
function openModal(html){
  closeModal();
  const mask = document.createElement('div');
  mask.className = 'modal-mask'; mask.id = 'modal';
  mask.innerHTML = `<div class="modal">${html}</div>`;
  mask.addEventListener('click', e => { if(e.target === mask) closeModal(); });
  document.body.appendChild(mask);
}
function closeModal(){ $('#modal')?.remove(); }

let siteTitle = 'cloud-r2pan';
let loginStage = 'password'; // 'password' | '2fa' | 'recovery'
let savedLoginKey = ''; // 第一阶段输入的 admin key

function showLogin(){
  document.title = t('docTitle', {site: siteTitle});

  if(loginStage === 'password'){
    renderLoginCard(`
      <h1>${esc(siteTitle)}</h1>
      <div class="sub">${esc(t('loginSubtitle'))}</div>
      <form id="login-form">
        <input type="password" id="login-key" placeholder="${esc(t('keyPlaceholder'))}" autocomplete="current-password" autofocus>
        <button class="btn primary" type="submit">${esc(t('login'))}</button>
        <div class="err" id="login-err"></div>
      </form>
      <div class="lang-row"><button class="btn sm" id="login-lang">${esc(t('switchTo'))}</button></div>
    `);
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const key = $('#login-key').value.trim();
      if(!key) return;
      savedLoginKey = key;
      $('#login-err').textContent = '';
      try{
        const r = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ key }) });
        if(r.need_2fa){
          loginStage = '2fa';
          showLogin();
        }else{
          showApp();
        }
      }catch(err){
        $('#login-err').textContent = err.message;
        shake();
      }
    };
    $('#login-lang').onclick = toggleLang;
  } else if(loginStage === '2fa'){
    renderLoginCard(`
      <h1>${esc(t('login2faTitle'))}</h1>
      <div class="sub">${esc(t('login2faSub'))}</div>
      <form id="login-form">
        <input type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" id="login-code" placeholder="${esc(t('login2faPh'))}" autocomplete="one-time-code" autofocus style="text-align:center;letter-spacing:.4em;font-size:20px">
        <button class="btn primary" type="submit">${esc(t('login2faCode'))}</button>
        <div class="err" id="login-err"></div>
      </form>
      <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
        <button class="btn sm" id="login-back">${esc(t('login2faBack'))}</button>
        <button class="btn sm" id="login-recovery">${esc(t('login2faUseRecovery'))}</button>
      </div>
    `);
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const code = $('#login-code').value.trim();
      if(!/^\d{6}$/.test(code)) return;
      $('#login-err').textContent = '';
      try{
        const r = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ key: savedLoginKey, code }) });
        showApp();
      }catch(err){
        $('#login-err').textContent = err.message;
        shake();
      }
    };
    $('#login-back').onclick = () => { loginStage = 'password'; showLogin(); };
    $('#login-recovery').onclick = () => { loginStage = 'recovery'; showLogin(); };
  } else {
    renderLoginCard(`
      <h1>${esc(t('login2faTitle'))}</h1>
      <div class="sub">${esc(t('login2faRecoveryHint'))}</div>
      <form id="login-form">
        <input type="text" id="login-recovery-code" placeholder="${esc(t('login2faRecoveryPh'))}" autocomplete="off" autofocus style="letter-spacing:.15em">
        <button class="btn primary" type="submit">${esc(t('confirm'))}</button>
        <div class="err" id="login-err"></div>
      </form>
      <div style="margin-top:14px">
        <button class="btn sm" id="login-back">${esc(t('login2faBack'))}</button>
      </div>
    `);
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const code = $('#login-recovery-code').value.trim();
      if(!code) return;
      $('#login-err').textContent = '';
      try{
        const r = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ key: savedLoginKey, code }) });
        if(r.recovery_used && r.totp_reset){
          // 弹出恢复成功提示
          openModal(`
            <h3>${esc(t('login2faRecoveryOk'))}</h3>
            <div class="sub">${esc(t('login2faRecoveryHint'))}</div>
            <div class="actions"><button class="btn primary" id="ok">${esc(t('confirm'))}</button></div>

          $('#ok').onclick = () => { closeModal(); showApp(); };
          return;
        }
        showApp();
      }catch(err){
        $('#login-err').textContent = err.message;
        shake();
      }
    };
    $('#login-back').onclick = () => { loginStage = '2fa'; showLogin(); };
  }
  // 焦点处理
  setTimeout(() => {
    const el = $('#login-form')?.querySelector('input');
    if(el) el.focus();
  }, 50);
}

function shake(){
  const c = $('.login-card');
  if(!c) return;
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}

      <div class="icon">☁️</div>
      <div class="t">${esc(t('dropTitle'))}</div>
      <div class="d">${esc(t('dropDesc'))}</div>

    <div id="upload-list"></div>
    <div class="glass section">
      <div class="section-title"><h2>📁 ${esc(t('allFiles'))}（${files.length}）</h2></div>
      ${files.length ? `
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th style="width:44px"></th><th>${esc(t('colName'))}</th><th>${esc(t('colSize'))}</th><th>${esc(t('colShareCount'))}</th><th>${esc(t('colDownloads'))}</th><th>${esc(t('colUploaded'))}</th><th style="width:170px">${esc(t('colActions'))}</th></tr></thead>
        <tbody>${files.map(f => `
          <tr>
            <td>${ficon(f.name)}</td>
            <td class="name-cell" title="${esc(f.name)}">${esc(f.name)}</td>
            <td class="num">${fmtSize(f.size)}</td>
            <td class="num">${f.share_count}</td>
            <td class="num">${f.download_count}</td>
            <td class="num">${fmtTime(f.uploaded_at)}</td>
            <td><div class="actions-cell">
              <button class="btn sm primary" data-share="${f.id}">${esc(t('createShare'))}</button>
              <button class="btn sm danger" data-del="${f.id}" data-name="${esc(f.name)}">${esc(t('del'))}</button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table></div>` : `<div class="empty"><div class="icon">📭</div>${esc(t('noFiles'))}</div>`}
    </div>`;

  const dz = $('#dropzone'), fi = $('#file-input');
  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); uploadFiles([...e.dataTransfer.files]); };
  fi.onchange = () => { uploadFiles([...fi.files]); fi.value = ''; };

  $$('[data-share]').forEach(b => b.onclick = () => openShareModal(b.dataset.share));
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if(!(await confirmDialog(t('deleteFileT'), t('deleteFileD', {name: b.dataset.name})))) return;
    await api(`/api/admin/files/${b.dataset.del}`, { method:'DELETE' });
    toast(t('fileDeleted'));
    loadFiles();
  });
}

function uploadFiles(files){
  for(const file of files){
    if(file.size > 100 * 1024 * 1024){ toast(t('tooLarge', {name: file.name}), 'err'); continue; }
    const item = document.createElement('div');
    item.className = 'upload-item glass';
    item.innerHTML = `${ficon(file.name)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(file.name)}</span>
      <div class="prog"><i></i></div><span class="pct">0%</span>`;
    $('#upload-list').prepend(item);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/admin/upload');
    xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e => {
      const pct = Math.round(e.loaded / e.total * 100);
      item.querySelector('.prog i').style.width = pct + '%';
      item.querySelector('.pct').textContent = pct + '%';
    };
    xhr.onload = () => {
      if(xhr.status === 201){ item.querySelector('.pct').textContent = t('uploadDone'); toast(t('uploadOk', {name: file.name})); loadFiles(); }
      else { item.querySelector('.pct').textContent = t('uploadFailShort'); toast(t('uploadFail', {name: file.name}), 'err'); }
    };
    xhr.onerror = () => { item.querySelector('.pct').textContent = t('uploadFailShort'); toast(t('uploadFail', {name: file.name}), 'err'); };
    xhr.send(file);
  }
}

/* ═══════════ 分享 ═══════════ */
async function loadShares(){
  const { shares } = await api('/api/admin/shares');
  const STATUS_KEY = { active:'stActive', expired:'stExpired', revoked:'stRevoked', maxed:'stMaxed' };
  $('#view').innerHTML = `
    <div class="glass section">
      <div class="section-title"><h2>🔗 ${esc(t('sharesTitle'))}（${shares.length}）</h2>
        <button class="btn sm" id="cleanup-shares">${esc(t('cleanup'))}</button></div>
      ${shares.length ? `
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>${esc(t('colFile'))}</th><th>${esc(t('colLink'))}</th><th>${esc(t('passwordCol'))}</th><th>${esc(t('colDownloads'))} / ${esc(t('colExpires'))}</th><th>${esc(t('colCreated'))}</th><th>${esc(t('colExpires'))}</th><th>${esc(t('colStatus'))}</th><th style="width:80px">${esc(t('colActions'))}</th></tr></thead>
        <tbody>${shares.map(s => {
          const pw = s.has_password ? (s.password_plain || '') : null;
          return `
          <tr>
            <td class="name-cell">${ficon(s.file_name)} ${esc(s.file_name)}</td>
            <td class="mono">${s.has_password?'🔒 ':''}<a href="/s/${s.id}" target="_blank" style="color:#a5d8ff;text-decoration:none">/s/${s.id}</a></td>
            <td class="mono">${pw ? `<span id="pw-${s.id}" style="font-family:ui-monospace,'SF Mono',monospace;color:#fde68a">••••••</span>
              <button class="btn sm" data-pw="${s.id}" data-val="${esc(pw)}" style="padding:2px 8px;font-size:11px;margin-left:4px">👁</button>
              <button class="btn sm" data-cpw="${esc(pw)}" style="padding:2px 8px;font-size:11px">📋</button>` : `<span style="color:var(--text-3)">—</span>`}</td>
            <td class="num">${s.download_count} / ${s.max_downloads ?? '∞'}</td>
            <td class="num">${fmtTime(s.created_at)}</td>
            <td class="num">${s.expires_at ? fmtTime(s.expires_at) : esc(t('forever'))}</td>
            <td><span class="tag ${s.status}"><i></i>${esc(t(STATUS_KEY[s.status]))}</span></td>
            <td><button class="btn sm danger" data-rv="${s.id}">${esc(t('revoke'))}</button></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>` : `<div class="empty"><div class="icon">🔗</div>${esc(t('noShares'))}</div>`}
    </div>`;
  $('#cleanup-shares').onclick = async () => {
    if(!(await confirmDialog(t('confirmCleanupT'), t('confirmCleanupD'), false))) return;
    const r = await api('/api/admin/shares/cleanup', { method:'POST' });
    toast(t('cleanedN', {n: r.deleted}));
    loadShares();
  };
  $$('[data-rv]').forEach(b => b.onclick = async () => {
    if(!(await confirmDialog(t('confirmRevokeT'), t('confirmRevokeD')))) return;
    await api(`/api/admin/shares/${b.dataset.rv}`, { method:'DELETE' });
    toast(t('shareRevoked'));
    loadShares();
  });
  // 密码显示/隐藏
  $$('[data-pw]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.pw, val = b.dataset.val;
      const el = $(`#pw-${id}`);
      if(el.textContent === '••••••') {
        el.textContent = val;
        b.textContent = '🙈';
      } else {
        el.textContent = '••••••';
        b.textContent = '👁';
      }
    };
  });
  // 复制密码
  $$('[data-cpw]').forEach(b => {
    b.onclick = () => copyText(b.dataset.cpw);
  });
}

/* ═══════════ 记录 ═══════════ */
async function loadLogs(){
  const q = encodeURIComponent(logsQuery);
  const d = await api(`/api/admin/logs?page=${logsPage}&per_page=20&q=${q}`);
  $('#view').innerHTML = `
    <div class="glass section">
      <div class="section-title"><h2>📜 ${esc(t('logsTitle'))}（${esc(t('totalN',{n:d.total}))}）</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="log-q" placeholder="${esc(t('searchPlaceholder'))}" value="${esc(logsQuery)}"
            style="padding:8px 14px;border-radius:12px;font-size:13px;font-family:inherit;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--stroke-strong);outline:none;width:180px">
          <button class="btn sm" id="clear-30">${esc(t('clear30'))}</button>
          <button class="btn sm danger" id="clear-all">${esc(t('clearAll'))}</button>
        </div>
      </div>
      ${d.logs.length ? `
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>${esc(t('colFile'))}</th><th>${esc(t('colIP'))}</th><th>${esc(t('colCountry'))}</th><th>${esc(t('colBrowser'))}</th><th>${esc(t('colOS'))}</th><th>${esc(t('colTraffic'))}</th><th>${esc(t('colTime'))}</th></tr></thead>
        <tbody>${d.logs.map(l => `
          <tr>
            <td class="name-cell" title="${esc(l.file_name)}">${ficon(l.file_name)} ${esc(l.file_name)}</td>
            <td class="mono">${esc(l.ip)}</td>
            <td>${esc(l.country || '—')}</td>
            <td>${esc(l.browser)}</td>
            <td>${esc(l.os)}</td>
            <td class="num">${fmtSize(l.bytes)}</td>
            <td class="num">${fmtTime(l.created_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
      <div class="pager">
        <button class="btn sm" id="pg-prev" ${d.page<=1?'disabled':''}>${esc(t('prev'))}</button>
        <span class="info">${esc(t('pageOf',{a:d.page,b:d.pages}))}</span>
        <button class="btn sm" id="pg-next" ${d.page>=d.pages?'disabled':''}>${esc(t('next'))}</button>
      </div>` : `<div class="empty"><div class="icon">📜</div>${esc(logsQuery ? t('noMatch') : t('noLogs'))}</div>`}
    </div>`;
  let timer;
  $('#log-q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { logsQuery = e.target.value.trim(); logsPage = 1; loadLogs(); }, 350); };
  $('#pg-prev').onclick = () => { logsPage--; loadLogs(); };
  $('#pg-next').onclick = () => { logsPage++; loadLogs(); };
  $('#clear-30').onclick = async () => {
    if(!(await confirmDialog(t('confirmClear30T'), t('confirmClear30D')))) return;
    const r = await api('/api/admin/logs?mode=older&days=30', { method:'DELETE' });
    toast(t('clearedN', {n: r.deleted})); loadLogs();
  };
  $('#clear-all').onclick = async () => {
    if(!(await confirmDialog(t('confirmClearAllT'), t('confirmClearAllD')))) return;
    const r = await api('/api/admin/logs?mode=all', { method:'DELETE' });
    toast(t('clearedN', {n: r.deleted})); loadLogs();
  };
}

/* ═══════════ 封禁 ═══════════ */
async function loadBans(){
  const { bans } = await api('/api/admin/bans');
  $('#view').innerHTML = `
    <div class="glass section" style="margin-bottom:18px">
      <div class="section-title"><h2>⛔ ${esc(t('manualBan'))}</h2></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="ban-ip" placeholder="${esc(t('ipPlaceholder'))}" class="mono"
          style="flex:1;min-width:160px;padding:11px 14px;border-radius:14px;font-size:14px;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--stroke-strong);outline:none">
        <input id="ban-reason" placeholder="${esc(t('reasonPlaceholder'))}"
          style="flex:1;min-width:160px;padding:11px 14px;border-radius:14px;font-size:14px;font-family:inherit;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--stroke-strong);outline:none">
        <button class="btn primary" id="ban-add">${esc(t('ban'))}</button>
      </div>
      <div class="field" style="margin:12px 0 0"><div class="tip">${esc(t('banTip'))}</div></div>
    </div>
    <div class="glass section">
      <div class="section-title"><h2>🚫 ${esc(t('banList'))}（${bans.length}）</h2></div>
      ${bans.length ? `
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>${esc(t('colIP'))}</th><th>${esc(t('colReason'))}</th><th>${esc(t('colBannedAt'))}</th><th>${esc(t('colUntil'))}</th><th style="width:80px">${esc(t('colActions'))}</th></tr></thead>
        <tbody>${bans.map(b => `
          <tr>
            <td class="mono">${esc(b.ip)}</td>
            <td class="name-cell" title="${esc(b.reason)}">${esc(b.reason || '—')}</td>
            <td class="num">${fmtTime(b.banned_at)}</td>
            <td class="num">${b.expires_at ? fmtTime(b.expires_at) : esc(t('forever'))}</td>
            <td><button class="btn sm" data-unban="${esc(b.ip)}">${esc(t('unban'))}</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>` : `<div class="empty"><div class="icon">✅</div>${esc(t('noBans'))}</div>`}
    </div>`;
  $('#ban-add').onclick = async () => {
    const ip = $('#ban-ip').value.trim();
    if(!ip) return toast(t('enterIp'), 'err');
    try{
      await api('/api/admin/bans', { method:'POST', body: JSON.stringify({ ip, reason: $('#ban-reason').value.trim() || undefined }) });
      toast(t('bannedIp', {ip})); loadBans();
    }catch(e){ toast(e.message, 'err'); }
  };
  $$('[data-unban]').forEach(b => b.onclick = async () => {
    await api(`/api/admin/bans/${encodeURIComponent(b.dataset.unban)}`, { method:'DELETE' });
    toast(t('unbannedIp', {ip: b.dataset.unban})); loadBans();
  });
}

/* ═══════════ 登录安全审计 ═══════════ */
let secPage = 1, secQuery = '', secAction = '', secResult = '';
async function loadSecurity(){
  const q = encodeURIComponent(secQuery);
  const params = `page=${secPage}&per_page=20&q=${q}&action=${secAction}&result=${secResult}`;
  const d = await api(`/api/admin/login-logs?${params}`);

  const actionMap = { login: t('actionLogin'), logout: t('actionLogout'), verify_fail: t('actionFail'), rate_limited: t('actionRateLimited') };
  const reasonMap = { invalid_key: t('secReasonInvalid'), rate_limited: t('secReasonRateLimited'), session_expired: t('secReasonSession') };

  const badge24h = d.fail_last_24h;
  $('#view').innerHTML = `
    ${badge24h > 0 ? `
    <div class="banner">
      <div class="ic">⚠️</div>
      <div><div class="t">${esc(t('secBadgeFail24h', {n: badge24h}))}</div>
      <div class="d">${esc(t('secSubtitle'))}</div></div>
    </div>` : ''}
    <div class="glass section" style="margin-bottom:18px">
      <div class="section-title"><h2>🛡️ ${esc(t('secTitle'))}</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${badge24h === 0 ? `<span class="tag active"><i></i>${esc(t('secBadgeSafe'))}</span>` : `<span class="tag revoked"><i></i>${esc(t('secBadgeFail24h',{n:badge24h}))}</span>`}
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="sec-action" style="padding:8px 12px;border-radius:12px;font-size:13px;font-family:inherit;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--stroke-strong);outline:none">
          <option value="" style="color:#111">${esc(t('secActionAll'))}</option>
          <option value="login" style="color:#111">${esc(t('actionLogin'))}</option>
          <option value="logout" style="color:#111">${esc(t('actionLogout'))}</option>
        </select>
        <select id="sec-result" style="padding:8px 12px;border-radius:12px;font-size:13px;font-family:inherit;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--stroke-strong);outline:none">
          <option value="" style="color:#111">${esc(t('secFilterAll'))}</option>
          <option value="success" style="color:#111">${esc(t('secFilterSuccess'))}</option>
          <option value="fail" style="color:#111">${esc(t('secFilterFail'))}</option>
        </select>
        <input id="sec-q" placeholder="${esc(t('secSearchPh'))}" value="${esc(secQuery)}"
          style="padding:8px 14px;border-radius:12px;font-size:13px;font-family:inherit;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--stroke-strong);outline:none;flex:1;min-width:160px">
        <button class="btn sm" id="sec-clear-30">${esc(t('secClear30'))}</button>
        <button class="btn sm danger" id="sec-clear-all">${esc(t('secClearAll'))}</button>
      </div>
    </div>
    <div class="glass section">
      ${d.logs.length ? `
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>${esc(t('colAction'))}</th><th>${esc(t('colIP'))}</th><th>${esc(t('colCountry'))}</th><th>${esc(t('colBrowser'))}</th><th>${esc(t('colOS'))}</th><th>${esc(t('colResult'))}</th><th>${esc(t('colReason'))}</th><th>${esc(t('colLoginTime'))}</th></tr></thead>
        <tbody>${d.logs.map(l => {
          const actText = actionMap[l.action] || l.action;
          const reasonText = l.reason ? (reasonMap[l.reason] || l.reason) : '—';
          return `<tr>
            <td><span class="tag ${l.result === 'success' ? 'active' : 'revoked'}"><i></i>${esc(actText)}</span></td>
            <td class="mono">${esc(l.ip)}</td>
            <td>${esc(l.country || '—')}</td>
            <td>${esc(l.browser)}</td>
            <td>${esc(l.os)}</td>
            <td>${l.result === 'success' ? '<span style="color:#6ee7b7">✓ ' + esc(t('resultSuccess')) + '</span>' : '<span style="color:#fda293">✗ ' + esc(t('resultFail')) + '</span>'}</td>
            <td class="name-cell" title="${esc(reasonText)}">${esc(reasonText)}</td>
            <td class="num">${fmtTime(l.created_at)}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
      <div class="pager">
        <button class="btn sm" id="sec-pg-prev" ${d.page<=1?'disabled':''}>${esc(t('prev'))}</button>
        <span class="info">${esc(t('pageOf',{a:d.page,b:d.pages}))} · ${esc(t('totalN',{n:d.total}))}</span>
        <button class="btn sm" id="sec-pg-next" ${d.page>=d.pages?'disabled':''}>${esc(t('next'))}</button>
      </div>` : `<div class="empty"><div class="icon">🛡️</div>${esc(t('secNoLogs'))}</div>`}
    </div>`;

  $('#sec-action').value = secAction;
  $('#sec-result').value = secResult;
  $('#sec-action').onchange = e => { secAction = e.target.value; secPage = 1; loadSecurity(); };
  $('#sec-result').onchange = e => { secResult = e.target.value; secPage = 1; loadSecurity(); };
  let secTimer;
  $('#sec-q').oninput = e => { clearTimeout(secTimer); secTimer = setTimeout(() => { secQuery = e.target.value.trim(); secPage = 1; loadSecurity(); }, 350); };
  $('#sec-pg-prev').onclick = () => { secPage--; loadSecurity(); };
  $('#sec-pg-next').onclick = () => { secPage++; loadSecurity(); };
  $('#sec-clear-30').onclick = async () => {
    if(!(await confirmDialog(t('secConfirmClear30T'), t('secConfirmClear30D'), false))) return;
    const r = await api('/api/admin/login-logs?mode=older&days=30', { method:'DELETE' });
    toast(t('secClearedN', {n: r.deleted})); loadSecurity();
  };
  $('#sec-clear-all').onclick = async () => {
    if(!(await confirmDialog(t('secConfirmClearAllT'), t('secConfirmClearAllD')))) return;
    const r = await api('/api/admin/login-logs?mode=all', { method:'DELETE' });
    toast(t('secClearedN', {n: r.deleted})); loadSecurity();
  };
}

        <button class="btn sm" id="ts-reset">${esc(t('tsResetVisits'))}</button>
      </div>
    </div>
    <button class="btn primary" id="st-save" style="padding:14px 28px;font-size:15px;border-radius:18px">${esc(t('save'))}</button>`;

  $('#st-reset-traffic').onclick = async () => {
    if(!(await confirmDialog(t('confirmResetT'), t('confirmResetD'), false))) return;
    await api('/api/admin/traffic/reset', { method:'POST' });
    toast(t('trafficResetOk'));
    loadSettings();
  };
  $('#st-clear-30').onclick = async () => {
    if(!(await confirmDialog(t('confirmClear30T'), t('confirmClear30D')))) return;
    const r = await api('/api/admin/logs?mode=older&days=30', { method:'DELETE' });
    toast(t('clearedN', {n: r.deleted}));
  };
  $('#st-clear-all').onclick = async () => {
    if(!(await confirmDialog(t('confirmClearAllT'), t('confirmClearAllD')))) return;
    const r = await api('/api/admin/logs?mode=all', { method:'DELETE' });
    toast(t('clearedN', {n: r.deleted}));
  };
  $('#st-save').onclick = async () => {
    const body = {
      site_title: $('#st-title').value.trim(),
      traffic_limit_gb: Number($('#st-limit').value) || 0,
      max_downloads_per_ip: Number($('#st-perip').value) || 0,
      count_window_hours: Number($('#st-window').value) || 0,
      auto_ban: $('#st-autoban').checked,
      ban_hours: Number($('#st-banhours').value) || 0,
      // Turnstile
      turnstile_mode: $('#ts-mode').value,
      turnstile_threshold: Number($('#ts-threshold').value) || 0,
      turnstile_sitekey_override: $('#ts-sitekey').value.trim(),
    };
    await api('/api/admin/settings', { method:'PUT', body: JSON.stringify(body) });
    toast(t('saved'));
    loadSettings();
  };

  // Turnstile 重置访问计数
  $('#ts-reset').onclick = async () => {
    if(!(await confirmDialog(t('tsResetVisits'), t('tsResetVisitsD'), false))) return;
    await api('/api/admin/turnstile/visits', { method:'DELETE' });
    toast(t('tsVisitsReset'));
  };

  // 2FA Setup
  $('#twofa-setup').onclick = async () => {
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      const r = await api('/api/admin/2fa/setup', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(r.uri)}`;
      openModal(`
        <h3>${esc(t('twofaSetupT'))}</h3>
        <div class="sub">${esc(t('twofaSetupD1'))}</div>
        <div style="text-align:center;margin:10px 0 8px">
          <img src="${qrUrl}" style="width:200px;height:200px;border-radius:12px;background:#fff;padding:10px">
        </div>
        <div style="margin:10px 0;font-size:13px">
          <div style="color:var(--text-3);margin-bottom:4px">${esc(t('twofaSetupKey'))}:</div>
          <input readonly value="${esc(r.secret)}" style="width:100%;padding:10px 12px;border-radius:10px;font-family:ui-monospace,'SF Mono',monospace;font-size:13px;color:#a5d8ff;background:rgba(0,0,0,.3);border:1px solid var(--stroke)" onclick="this.select()">
        </div>
        <div class="field" style="margin:12px 0">
          <input type="text" id="2fa-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="${esc(t('twofaSetupCodePh'))}" style="text-align:center;letter-spacing:.4em;font-size:18px">
        </div>
        <div class="actions">
          <button class="btn" data-x>${esc(t('cancel'))}</button>
          <button class="btn primary" id="2fa-enable">${esc(t('confirm'))}</button>
        </div>
      `);
      $('[data-x]').onclick = closeModal;
      $('#2fa-enable').onclick = async () => {
        const code = $('#2fa-code').value.trim();
        if(!/^\d{6}$/.test(code)) return;
        try{
          const en = await api('/api/admin/2fa/enable', { method:'POST', body: JSON.stringify({ admin_key: adminKey, code, secret: r.secret }) });
          closeModal();
          // 展示恢复码
          showRecoveryCodes(en.recovery_codes);
        }catch(err){ toast(err.message, 'err'); }
      };
    }catch(err){ toast(err.message, 'err'); }
  };

  // ── 2FA Disable ──
  $('#twofa-disable').onclick = async () => {
    if(!(await confirmDialog(t('twofaDisableT'), t('twofaDisableD'), true))) return;
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      await api('/api/admin/2fa/disable', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      toast(t('twofaSetupT').includes('开启') ? '2FA 已关闭' : '2FA disabled');
      loadSettings();
    }catch(err){ toast(err.message, 'err'); }
  };

  // ── 2FA Regen Recovery ──
  $('#twofa-regen').onclick = async () => {
    if(!(await confirmDialog(t('twofaRegenT'), t('twofaRegenD'), false))) return;
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      const r = await api('/api/admin/2fa/regen-recovery', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      showRecoveryCodes(r.recovery_codes);
    }catch(err){ toast(err.message, 'err'); }
  };
}

function promptAdminKey(){
  return new Promise(resolve => {
    openModal(`
      <h3>${esc(t('twofaAdminKeyPh'))}</h3>
      <form id="pk-form"><input type="password" id="pk-input" autofocus placeholder="${esc(t('keyPlaceholder'))}" style="text-align:center"></form>
      <div class="actions" style="margin-top:16px">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn primary" id="pk-ok">${esc(t('confirm'))}</button>
      </div>
    `);
    $('[data-x]').onclick = () => { closeModal(); resolve(null); };
    $('#pk-ok').onclick = () => { const v = $('#pk-input').value.trim(); closeModal(); resolve(v || null); };
    $('#pk-form').onsubmit = e => { e.preventDefault(); $('#pk-ok').click(); };
    setTimeout(() => $('#pk-input').focus(), 50);
  });
}

function showRecoveryCodes(codes){
  openModal(`
    <h3>✅ ${esc(t('twofaSetupDone'))}</h3>
    <div class="sub">${esc(t('twofaSetupRecoveryT'))}</div>
    <div style="margin:10px 0">
      <div class="banner" style="border-radius:14px;padding:12px 16px">
        <div class="ic">⚠️</div>
        <div class="t" style="color:#ffd9a0;font-size:13px">${esc(t('twofaSetupRecoveryD'))}</div>
      </div>
      <div style="background:rgba(0,0,0,.3);border-radius:12px;padding:16px;font-family:ui-monospace,'SF Mono',monospace;font-size:14px;color:#fde68a;line-height:1.8">
        ${codes.map(c => `<div>${esc(c)}</div>`).join('')}
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="rc-copy">${esc(t('copy'))}</button>
      <button class="btn primary" data-x>${esc(t('close'))}</button>
    </div>
  `);
  $('#rc-copy').onclick = () => copyText(codes.join('\n')).then(() => toast(t('twofaSetupRecoveryCopied')));
  $('[data-x]').onclick = () => { closeModal(); loadSettings(); };
}

/* ═══════════ 启动 ═══════════ */
(async () => {
  try{
    const s = await api('/api/admin/session');
    siteTitle = s.site_title || siteTitle;
    showApp();
  }catch{
    // api() 内部已对 401 调用 showLogin() 并 throw，这里静默兜底即可
    // 若 api() 因其他错误 throw，也不渲染空页面
    if (!document.querySelector('#login-view')) showLogin();
  }
})();
</script>
</body>
</html>
