<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-r2pan</title>
<style>
/* ═══════════════════════════════════════════════════════════
   默认主题：简洁暗色（无玻璃模糊）
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg-page: #0f0f10;
  --orb-1: transparent; --orb-2: transparent; --orb-3: transparent;
  --orb-opacity: 0;

  --glass: #1c1c1f;
  --glass-strong: #242428;
  --stroke: rgba(255,255,255,.08);
  --stroke-strong: rgba(255,255,255,.14);

  --text: #f0f0f2;
  --text-2: rgba(255,255,255,.58);
  --text-3: rgba(255,255,255,.34);

  --sf-soft: rgba(255,255,255,.04);
  --sf: rgba(255,255,255,.055);
  --sf-strong: rgba(255,255,255,.09);
  --sf-input: rgba(255,255,255,.07);
  --sf-input-focus: rgba(255,255,255,.11);

  --shadow-soft: 0 2px 8px rgba(0,0,0,.4);
  --shadow-topbar: 0 2px 6px rgba(0,0,0,.4);
  --shadow-inset-hi: none;
  --shadow-glass: 0 1px 3px rgba(0,0,0,.5);
  --shadow-topbar-box: 0 1px 3px rgba(0,0,0,.5);
  --shadow-modal: 0 10px 40px rgba(0,0,0,.5);
  --shadow-btn-primary: 0 2px 6px rgba(10,124,255,.3);
  --shadow-btn-danger: 0 2px 6px rgba(255,69,58,.18);
  --shadow-btn-plain: 0 1px 0 rgba(0,0,0,.5);
  --shadow-btn-plain-hover: 0 1px 4px rgba(0,0,0,.5);
  --shadow-spinner-track: rgba(255,255,255,.12);
  --shadow-switch-thumb: 0 1px 3px rgba(0,0,0,.5);
  --shadow-toast: 0 6px 20px rgba(0,0,0,.6);
  --shadow-logo: none;

  --scrollbar-thumb: rgba(255,255,255,.12);
  --track-bg: rgba(255,255,255,.1);
  --bar-bg: rgba(255,255,255,.1);
  --tbl-divider: rgba(255,255,255,.06);
  --tbl-hover: rgba(255,255,255,.05);
  --tbl-row-border: rgba(255,255,255,.07);
  --dashed-border: rgba(255,255,255,.22);
  --dropzone-bg: rgba(255,255,255,.025);
  --dropzone-hover-bg: rgba(255,255,255,.06);
  --dashed-border-strong: rgba(255,255,255,.45);
  --btn-hover-bg: rgba(255,255,255,.1);
  --btn-danger-bg: rgba(255,69,58,.1);
  --btn-danger-bg-hover: rgba(255,69,58,.18);
  --btn-danger-bg-active: rgba(255,69,58,.26);
  --btn-danger-border: rgba(255,69,58,.28);
  --btn-danger-color: #ffb3ae;
  --radius: 18px;
  --blue: #0a84ff;
}

/* ═══════════════════════════════════════════════════════════
   简洁亮色
   ═══════════════════════════════════════════════════════════ */
:root[data-theme="light"] {
  --bg-page: #f5f5f7;
  --orb-1: transparent; --orb-2: transparent; --orb-3: transparent;
  --orb-opacity: 0;

  --glass: #ffffff;
  --glass-strong: #ffffff;
  --stroke: rgba(0,0,0,.07);
  --stroke-strong: rgba(0,0,0,.14);

  --text: #1d1d1f;
  --text-2: rgba(0,0,0,.58);
  --text-3: rgba(0,0,0,.35);

  --sf-soft: rgba(0,0,0,.04);
  --sf: rgba(0,0,0,.055);
  --sf-strong: rgba(0,0,0,.09);
  --sf-input: rgba(0,0,0,.05);
  --sf-input-focus: rgba(0,0,0,.08);

  --shadow-soft: 0 1px 3px rgba(0,0,0,.08);
  --shadow-topbar: 0 1px 2px rgba(0,0,0,.08);
  --shadow-inset-hi: none;
  --shadow-glass: 0 1px 3px rgba(0,0,0,.08);
  --shadow-topbar-box: 0 1px 2px rgba(0,0,0,.08);
  --shadow-modal: 0 10px 40px rgba(0,0,0,.12);
  --shadow-btn-primary: 0 2px 6px rgba(10,124,255,.25);
  --shadow-btn-danger: 0 2px 6px rgba(255,69,58,.12);
  --shadow-btn-plain: 0 1px 0 rgba(0,0,0,.08);
  --shadow-btn-plain-hover: 0 1px 4px rgba(0,0,0,.08);
  --shadow-spinner-track: rgba(0,0,0,.1);
  --shadow-switch-thumb: 0 1px 3px rgba(0,0,0,.2);
  --shadow-toast: 0 6px 20px rgba(0,0,0,.12);
  --shadow-logo: none;

  --scrollbar-thumb: rgba(0,0,0,.12);
  --track-bg: rgba(0,0,0,.12);
  --bar-bg: rgba(0,0,0,.1);
  --tbl-divider: rgba(0,0,0,.06);
  --tbl-hover: rgba(0,0,0,.04);
  --tbl-row-border: rgba(0,0,0,.07);
  --dashed-border: rgba(0,0,0,.22);
  --dropzone-bg: rgba(0,0,0,.025);
  --dropzone-hover-bg: rgba(0,0,0,.05);
  --dashed-border-strong: rgba(0,0,0,.45);
  --btn-hover-bg: #ffffff;
  --btn-danger-bg: rgba(255,59,48,.08);
  --btn-danger-bg-hover: rgba(255,59,48,.14);
  --btn-danger-bg-active: rgba(255,59,48,.2);
  --btn-danger-border: rgba(255,59,48,.22);
  --btn-danger-color: #d70015;
}

/* ═══════════════════════════════════════════════════════════
   Apple 亮色玻璃风（隐藏，需访问 /admin/apple 启用）
   ═══════════════════════════════════════════════════════════ */
:root[data-theme="apple"] {
  --bg-page: linear-gradient(180deg, #f7f7fb 0%, #f0f1f6 100%);
  --orb-1: #c7e9ff; --orb-2: #d5c6ff; --orb-3: #fbcfe8;
  --orb-opacity: 0.22;

  --glass: rgba(255,255,255,.88);
  --glass-strong: rgba(255,255,255,.95);
  --stroke: rgba(0,0,0,.08);
  --stroke-strong: rgba(0,0,0,.16);

  --text: #111113;
  --text-2: rgba(0,0,0,.62);
  --text-3: rgba(0,0,0,.38);

  --sf-soft: rgba(0,0,0,.04);
  --sf: rgba(0,0,0,.055);
  --sf-strong: rgba(0,0,0,.09);
  --sf-input: rgba(0,0,0,.05);
  --sf-input-focus: rgba(0,0,0,.08);

  --shadow-soft: 0 4px 24px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow-topbar: 0 2px 12px rgba(0,0,0,.05);
  --shadow-inset-hi: inset 0 1px 0 rgba(255,255,255,.9);
  --shadow-glass: 0 4px 24px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow-topbar-box: 0 2px 12px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.9);
  --shadow-modal: 0 10px 40px rgba(0,0,0,.12);
  --shadow-btn-primary: 0 4px 14px rgba(10,124,255,.28), inset 0 1px 0 rgba(255,255,255,.5);
  --shadow-btn-danger: 0 4px 14px rgba(255,69,58,.15);
  --shadow-btn-plain: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --shadow-btn-plain-hover: 0 3px 10px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-spinner-track: rgba(0,0,0,.12);
  --shadow-switch-thumb: 0 2px 6px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.6);
  --shadow-toast: 0 10px 30px rgba(0,0,0,.12);
  --shadow-logo: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 12px rgba(59,130,246,.35);

  --scrollbar-thumb: rgba(0,0,0,.12);
  --track-bg: rgba(0,0,0,.12);
  --bar-bg: rgba(0,0,0,.1);
  --tbl-divider: rgba(0,0,0,.06);
  --tbl-hover: rgba(0,0,0,.04);
  --tbl-row-border: rgba(0,0,0,.07);
  --dashed-border: rgba(0,0,0,.22);
  --dropzone-bg: rgba(0,0,0,.025);
  --dropzone-hover-bg: rgba(0,0,0,.05);
  --dashed-border-strong: rgba(0,0,0,.45);
  --btn-hover-bg: #ffffff;
  --btn-danger-bg: rgba(255,59,48,.08);
  --btn-danger-bg-hover: rgba(255,59,48,.14);
  --btn-danger-bg-active: rgba(255,59,48,.2);
  --btn-danger-border: rgba(255,59,48,.22);
  --btn-danger-color: #d70015;
  --radius: 24px;
}

/* ═══════════════════════════════════════════════════════════
   Apple 暗色玻璃风（隐藏）
   ═══════════════════════════════════════════════════════════ */
:root[data-theme="apple-dark"] {
  --bg-page: linear-gradient(165deg, #0b1026 0%, #151238 42%, #26104a 100%);
  --orb-1: #22d3ee; --orb-2: #7c5cf6; --orb-3: #ec4899;
  --orb-opacity: 0.45;

  --glass: rgba(255,255,255,.09);
  --glass-strong: rgba(255,255,255,.14);
  --stroke: rgba(255,255,255,.16);
  --stroke-strong: rgba(255,255,255,.28);

  --text: #fff;
  --text-2: rgba(255,255,255,.66);
  --text-3: rgba(255,255,255,.42);

  --sf-soft: rgba(255,255,255,.05);
  --sf: rgba(255,255,255,.07);
  --sf-strong: rgba(255,255,255,.13);
  --sf-input: rgba(255,255,255,.09);
  --sf-input-focus: rgba(255,255,255,.13);

  --shadow-soft: 0 16px 44px rgba(0,0,0,.35);
  --shadow-topbar: 0 14px 40px rgba(0,0,0,.4);
  --shadow-inset-hi: inset 0 1px 0 rgba(255,255,255,.22);
  --shadow-glass: 0 16px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
  --shadow-topbar-box: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
  --shadow-modal: 0 -20px 60px rgba(0,0,0,.5);
  --shadow-btn-primary: 0 8px 22px rgba(10,124,255,.38), inset 0 1px 0 rgba(255,255,255,.35);
  --shadow-btn-danger: 0 4px 14px rgba(255,69,58,.2);
  --shadow-spinner-track: rgba(255,255,255,.18);
  --shadow-switch-thumb: 0 3px 8px rgba(0,0,0,.35);
  --shadow-toast: 0 12px 32px rgba(0,0,0,.45);

  --scrollbar-thumb: rgba(255,255,255,.15);
  --track-bg: rgba(255,255,255,.14);
  --bar-bg: rgba(255,255,255,.12);
  --tbl-divider: rgba(255,255,255,.06);
  --tbl-hover: rgba(255,255,255,.05);
  --tbl-row-border: rgba(255,255,255,.07);
  --dashed-border: rgba(255,255,255,.28);
  --dropzone-bg: rgba(255,255,255,.045);
  --dropzone-hover-bg: rgba(255,255,255,.1);
  --dashed-border-strong: rgba(255,255,255,.5);
  --btn-hover-bg: rgba(255,255,255,.17);
  --btn-danger-bg: rgba(255,69,58,.16);
  --btn-danger-bg-hover: rgba(255,69,58,.26);
  --btn-danger-bg-active: rgba(255,69,58,.36);
  --btn-danger-border: rgba(255,69,58,.4);
  --btn-danger-color: #ffb3ae;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
  min-height: 100vh; color: var(--text); position: relative; overflow-x: hidden;
  background: var(--bg-page);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: rgba(10,132,255,.35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }

/* ── 背景光斑 ─────────────────────────── */
.orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .45; pointer-events: none; animation: drift 22s ease-in-out infinite alternate; z-index: 0; }
.o1 { width: 52vmax; height: 52vmax; background: var(--orb-1); top: -20%; left: -16%; opacity: var(--orb-opacity); }
.o2 { width: 44vmax; height: 44vmax; background: var(--orb-2); bottom: -22%; right: -12%; animation-delay: -8s; opacity: var(--orb-opacity); }
.o3 { width: 30vmax; height: 30vmax; background: var(--orb-3); top: 48%; left: 12%; animation-delay: -15s; opacity: var(--orb-opacity); }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(5vw,-6vh) scale(1.15); } }

/* ── 布局 ─────────────────────────────── */
#app { position: relative; z-index: 1; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px clamp(14px, 3vw, 28px) 60px; }
.layout { display: flex; gap: 20px; align-items: flex-start; }
.layout #view { flex: 1; min-width: 0; }

/* ── 玻璃卡片 ─────────────────────────── */
.glass {
  background: var(--glass);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  box-shadow: var(--shadow-glass);
}
:root[data-theme="apple"] .glass,
:root[data-theme="apple-dark"] .glass {
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
  border: 0.5px solid rgba(0,0,0,.08);
}
:root[data-theme="apple-dark"] .glass { border: 1px solid var(--stroke-strong); }

/* ── 顶栏 ─────────────────────────────── */
.topbar {
  position: sticky; top: 12px; z-index: 50; margin-bottom: 22px;
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  background: var(--glass-strong);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid var(--stroke); border-radius: 22px;
  box-shadow: var(--shadow-topbar-box);
}
:root[data-theme="apple"] .topbar,
:root[data-theme="apple-dark"] .topbar {
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid rgba(0,0,0,.08);
}
:root[data-theme="apple-dark"] .topbar { border: 1px solid var(--stroke-strong); box-shadow: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25); }
.logo { width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(150deg, #67e8f9, #3b82f6 55%, #8b5cf6);
  box-shadow: var(--shadow-logo); }
.logo svg { width: 22px; height: 22px; }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.topbar .sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.topbar .spacer { flex: 1; }
.traffic-pill {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 14px;
  background: var(--sf); border: 1px solid var(--stroke);
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap;
  transition: background .2s;
}
.traffic-pill:hover { background: var(--sf-strong); }
.traffic-pill .bar { width: 52px; height: 5px; border-radius: 3px; background: var(--track-bg); overflow: hidden; }
.traffic-pill .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .5s cubic-bezier(.22,1,.36,1); }
.traffic-pill.danger .bar i { background: linear-gradient(90deg,#fbbf24,#ff453a); }
.traffic-pill.danger { color: #ffb3ae; }

/* ── 侧边栏导航 ────────────────────────── */
.sidebar {
  flex: none; width: 188px; padding: 14px 10px;
  background: var(--glass);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid var(--stroke); border-radius: 22px;
  box-shadow: var(--shadow-glass);
  display: flex; flex-direction: column; gap: 4px; position: sticky; top: 90px;
  max-height: calc(100vh - 110px); overflow-y: auto; scrollbar-width: thin;
}
:root[data-theme="apple"] .sidebar,
:root[data-theme="apple-dark"] .sidebar {
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
  border: 0.5px solid rgba(0,0,0,.08);
}
:root[data-theme="apple-dark"] .sidebar { border: 1px solid var(--stroke-strong); box-shadow: 0 16px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22); }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
.sb-main {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 14px; cursor: pointer;
  color: var(--text-2); font-size: 14px; font-weight: 600;
  background: transparent; border: none; font-family: inherit; text-align: left;
  transition: all .22s; width: 100%; user-select: none;
}
.sb-main:hover { background: var(--sf); color: var(--text); }
.sb-main .ic { font-size: 17px; width: 22px; text-align: center; flex: none; }
.sb-main .chev { margin-left: auto; font-size: 10px; opacity: .5; transition: transform .25s; }
.sb-main.open { color: var(--text); background: var(--sf-strong); box-shadow: var(--shadow-inset-hi); }
.sb-main.open .chev { transform: rotate(90deg); opacity: .8; }
.sb-main.single .chev { display: none; }
.sb-sub {
  overflow: hidden; max-height: 0; transition: max-height .35s cubic-bezier(.22,1,.36,1);
  display: flex; flex-direction: column; gap: 2px; padding-left: 24px;
}
.sb-sub.open { max-height: 400px; }
.sb-sub button {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 10px; cursor: pointer;
  color: var(--text-3); font-size: 13px; font-weight: 500;
  background: transparent; border: none; font-family: inherit; text-align: left;
  transition: all .18s; width: 100%; user-select: none;
}
.sb-sub button:hover { color: var(--text); background: var(--sf); }
.sb-sub button.active {
  color: var(--text); background: rgba(10,132,255,.15);
  box-shadow: inset 2px 0 0 #0a84ff, var(--shadow-inset-hi);
  font-weight: 600;
}

/* ── 移动端折叠 ───────────────────────── */
@media (max-width: 760px) {
  .layout { flex-direction: column; }
  .sidebar {
    position: static; width: 100%; max-height: none;
    flex-direction: row; flex-wrap: wrap; gap: 6px;
    padding: 10px;
  }
  .sb-main { padding: 7px 12px; font-size: 13px; }
  .sb-main .chev { display: none; }
  .sb-sub { display: none; }
}

/* ── 统计卡片 ─────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card { padding: 20px 22px; border-radius: 22px; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
.stat-card:nth-child(2){animation-delay:.05s}.stat-card:nth-child(3){animation-delay:.1s}.stat-card:nth-child(4){animation-delay:.15s}
.stat-card .label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.stat-card .value { margin-top: 8px; font-size: 27px; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-card .value small { font-size: 14px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
.progress { margin-top: 12px; height: 7px; border-radius: 4px; background: var(--bar-bg); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .6s cubic-bezier(.22,1,.36,1); }
.progress.hot i { background: linear-gradient(90deg,#fbbf24,#ff453a); }
.stat-card .foot { margin-top: 8px; font-size: 12px; color: var(--text-3); }

/* ── 通用卡片区块 ─────────────────────── */
.section { padding: 22px; margin-bottom: 18px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.section-title h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }

/* ── 图表 ─────────────────────────────── */
.chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; min-width: 0; height: 100%; }
.chart .bar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, rgba(103,232,249,.95), rgba(59,130,246,.55));
  box-shadow: var(--shadow-inset-hi); transition: height .7s cubic-bezier(.22,1,.36,1); min-height: 3px; position: relative; }
.chart .bar:hover { background: linear-gradient(180deg, #67e8f9, #3b82f6); }
.chart .bar span { position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text-2); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.chart .bar:hover span { opacity: 1; }
.chart .day { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── 表格 ─────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; padding: 9px 10px; color: var(--text-3); font-weight: 600; font-size: 12px;
  border-bottom: 1px solid var(--stroke); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--tbl-divider); white-space: nowrap; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr { transition: background .15s; }
.tbl tbody tr:hover { background: var(--tbl-hover); }
.tbl .num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 12.5px; }
.name-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
.empty .icon { font-size: 34px; margin-bottom: 10px; opacity: .7; }

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
};

function fmtSize(n){
  n = Number(n)||0;
  if(n < 1024) return n + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { n /= 1024; i++; } while(n >= 1024 && i < u.length-1);
  return n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2) + ' ' + u[i];
}
function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(Number(ts)), p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function api(path, opts={}){
  const r = await fetch(path, { credentials:'same-origin', ...opts,
    headers: { ...(opts.body && !(opts.body instanceof FormData) ? {'content-type':'application/json'} : {}), ...(opts.headers||{}) } });
  let data = null;
  try { data = await r.json(); } catch {}
  if(r.status === 401 && !path.includes('/login')) { showLogin(); throw new Error('unauthorized'); }
  if(!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
  return data;
}

/* ═══════════ 错误上报 ═══════════
 * 捕获前端未处理异常并上报到 /api/admin/errors，写入错误日志表，
 * 方便开发者在「错误日志」标签页查看、排查反馈。
 * 同一错误在当前会话内只上报一次（按 来源+信息+文件+行号 去重），
 * 并设上限，防止异常风暴刷爆日志。上报失败静默忽略。
 */
const _errSigs = new Set();
function reportError(info){
  try{
    const sig = [info.source || 'frontend', info.message || '', info.url || '', info.line || ''].join('|');
    if(_errSigs.has(sig) || _errSigs.size >= 40) return;
    _errSigs.add(sig);
    fetch('/api/admin/errors', {
      method: 'POST', credentials: 'same-origin', keepalive: true,
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ...info, path: info.path || (location.pathname + location.hash) }),
    }).catch(() => {});
  }catch(_){ /* 上报本身失败不影响页面 */ }
}
window.addEventListener('error', e => {
  if(!e || !e.message) return; // 资源加载失败（img/script）没有 message，忽略
  reportError({ source:'frontend', message: e.message, url: e.filename, line: e.lineno, col: e.colno,
    stack: e.error && e.error.stack });
});
window.addEventListener('unhandledrejection', e => {
  const r = e && e.reason;
  const msg = r && (r.message || String(r)) ? (r.message || String(r)) : String(r);
  reportError({ source:'frontend', message: msg, stack: (r && r.stack) || null, context: 'unhandledrejection' });
});

function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2600);
}

function copyText(text){
  if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => toast(t('copied')));
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove();
  return Promise.resolve(toast(t('copied')));
}

/* 二维码：懒加载 qrcode-generator，产出可直接塞进 <img> 的 data URL */
let _qrLibPromise = null;
function loadQrLib(){
  if(window.qrcode) return Promise.resolve(window.qrcode);
  if(_qrLibPromise) return _qrLibPromise;
  _qrLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    s.async = true;
    s.onload = () => (window.qrcode ? resolve(window.qrcode) : reject(new Error('qrcode missing')));
    s.onerror = () => reject(new Error('qrcode load failed'));
    document.head.appendChild(s);
  });
  return _qrLibPromise;
}
async function qrDataUrl(text){
  const qrcode = await loadQrLib();
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const svg = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/** 可用登录方式 —— 启动时探测，登录页据此渲染 */
let authMethods = { providers: {} };

/** 已启用登录方式的签名，用于判断是否需要重渲染登录页 */
function enabledProviderSig(am){
  const p = am?.providers || {};
  return ADMIN_PROVIDERS.map(x => x.id + (p[x.id]?.enabled ? '1' : '0')).join(',');
}

async function loadAuthMethods(){
  const prevSig = enabledProviderSig(authMethods);
  try{
    const r = await fetch('/api/admin/auth-methods', { credentials:'same-origin', cache:'no-store' });
    if(r.ok) authMethods = await r.json();
  }catch{}
  // 仅当可用状态发生变化时才重渲染，避免把用户已输入的管理密钥清空
  if(prevSig !== enabledProviderSig(authMethods) && document.querySelector('#login-view') && loginStage === 'password') showLogin();
}

/**
 * 静默探测会话（不触发登录页重渲染，带超时）—— 启动阶段判断是否已登录。
 * 未登录 / 请求失败 / 超时 一律返回 null，绝不抛出、绝不阻塞首屏渲染。
 */
async function fetchSession(timeoutMs = 8000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try{
    const r = await fetch('/api/admin/session', { credentials:'same-origin', cache:'no-store', signal: ctrl.signal });
    if(!r.ok) return null;          // 401 等 → 未登录
    return await r.json();
  }catch{
    return null;                    // 网络错误 / 超时 → 视为未登录
  }finally{
    clearTimeout(timer);
  }
}

/** 把回调带回的错误码映射成可读文案（含 Provider 原始错误，便于定位问题） */
function oauthErrMessage(code, name, desc){
  const map = {
    state_invalid: t('lmErrState'),
    bad_intent: t('lmErrState'),
    missing_code: t('lmErrGeneric'),
    not_available: t('lmErrNotAvailable', { name }),
    disabled: t('lmErrNotAvailable', { name }),
    not_bound: t('lmErrNotBound'),
    unsupported: t('lmErrUnsupported'),
    not_configured: t('lmErrNotConfigured'),
    secret_decrypt_failed: t('lmErrSecret'),
    redirect_uri_mismatch: t('lmErrRedirect'),
    userinfo_failed: t('lmErrGeneric'),
  };
  const base = map[code] || t('lmErrGeneric');
  const detail = [code, desc].filter(Boolean).join(': ');
  return detail && !map[code] ? `${base} (${detail})` : base;
}

/** 处理第三方登录/绑定回调带回的 query 参数提示 */
function handleOauthRedirectParams(){
  const p = new URLSearchParams(location.search);
  const err = p.get('oauth_error');
  const errDesc = p.get('oauth_error_desc');
  const bound = p.get('oauth_bound');
  const providerId = p.get('oauth_provider') || bound || '';
  if(!err && !bound) return;
  if(bound){
    toast(t('lmBoundOk', { name: providerName(bound) }));
    loadAuthMethods();
    if(currentTab === 'logins') loadAdminLogins();
  }
  if(err){
    toast(oauthErrMessage(err, providerName(providerId), errDesc), 'err');
  }
  history.replaceState(null, '', location.pathname);
}

/* ═══════════ 标签页自定义 ═══════════
 * 配置结构：{ version: 1, groups: [ { key, visible, subs?: [ { tab, visible } ] } ] }
 * 仅存「显示/隐藏」与「顺序」；图标与文案始终取自 NAV_GROUPS 默认定义。
 * 「system」分组与「settings」标签是管理入口，强制可见（防止把自己锁在配置页外）。
 */
const LOCKED_TABS = new Set(['settings']);

function defaultTabConfig(){
  return {
    version: 1,
    groups: NAV_GROUPS.map(g => ({
      key: g.key,
      visible: true,
      ...(g.subs ? { subs: g.subs.map(s => ({ tab: s.tab, visible: true })) } : {}),
    })),
  };
}

/** 把任意输入（含 null / 残缺 / 未知 key）归一化为合法配置 */
function normalizeTabConfig(input){
  const def = defaultTabConfig();
  const defByKey = new Map(def.groups.map(g => [g.key, g]));
  const defSubTabs = new Map(NAV_GROUPS.filter(g => g.subs).map(g => [g.key, g.subs.map(s => s.tab)]));
  const srcGroups = (input && Array.isArray(input.groups)) ? input.groups : [];
  const srcByKey = new Map();
  srcGroups.forEach(g => { if (g && typeof g.key === 'string' && !srcByKey.has(g.key)) srcByKey.set(g.key, g); });

  // 顺序：输入中已知的 key 优先（去重），再补上默认里缺失的 key
  const order = [];
  srcGroups.forEach(g => { if (g && defByKey.has(g.key) && !order.includes(g.key)) order.push(g.key); });
  def.groups.forEach(g => { if (!order.includes(g.key)) order.push(g.key); });

  return {
    version: 1,
    groups: order.map(key => {
      const src = srcByKey.get(key) || {};
      const d = defByKey.get(key);
      const out = { key, visible: src.visible !== false };
      if (d.subs){
        const tabs = defSubTabs.get(key) || [];
        const srcSubs = Array.isArray(src.subs) ? src.subs : [];
        const subOrder = [];
        srcSubs.forEach(s => { if (s && tabs.includes(s.tab) && !subOrder.includes(s.tab)) subOrder.push(s.tab); });
        tabs.forEach(tb => { if (!subOrder.includes(tb)) subOrder.push(tb); });
        const srcSubByTab = new Map();
        srcSubs.forEach(s => { if (s && typeof s.tab === 'string' && !srcSubByTab.has(s.tab)) srcSubByTab.set(s.tab, s); });
        out.subs = subOrder.map(tb => {
          const ss = srcSubByTab.get(tb) || {};
          return { tab: tb, visible: ss.visible !== false };
        });
      }
      return out;
    }),
  };
}

/** 强制锁定管理入口可见（settings 标签及其所属分组） */
function enforceLockedTabs(cfg){
  cfg.groups.forEach(g => {
    if ((g.subs || []).some(s => LOCKED_TABS.has(s.tab))) g.visible = true;
    (g.subs || []).forEach(s => { if (LOCKED_TABS.has(s.tab)) s.visible = true; });
  });
  return cfg;
}

/** 计算生效的侧边栏分组（按配置排序 + 过滤隐藏项） */
function computeEffectiveNavGroups(cfg){
  const out = [];
  cfg.groups.forEach(cg => {
    const def = NAV_GROUPS.find(g => g.key === cg.key);
    if (!def || !cg.visible) return;
    if (def.subs){
      const subs = (cg.subs || []).filter(s => s.visible).map(s => {
        const sd = def.subs.find(x => x.tab === s.tab);
        return sd ? { tab: sd.tab, label: sd.label, ic: sd.ic } : null;
      }).filter(Boolean);
      if (!subs.length) return; // 分组内全部隐藏 → 整个分组也不显示
      out.push({ key: def.key, ic: def.ic, label: def.label, subs });
    } else {
      out.push({ key: def.key, ic: def.ic, label: def.label, tab: def.tab });
    }
  });
  return out;
}

function buildTabToGroup(groups){
  const m = {};
  groups.forEach(g => {
    if (g.tab) m[g.tab] = g.key;
    if (g.subs) g.subs.forEach(s => { m[s.tab] = g.key; });
  });
  return m;
}

let tabConfig = enforceLockedTabs(normalizeTabConfig(null));
let EFFECTIVE_NAV_GROUPS = computeEffectiveNavGroups(tabConfig);
let TAB_TO_GROUP = buildTabToGroup(EFFECTIVE_NAV_GROUPS);

/** 解析后端存储的 JSON 字符串 */
function parseStoredTabConfig(raw){
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

/** 应用配置并重渲染侧边栏导航 */
function applyTabConfig(cfg){
  tabConfig = enforceLockedTabs(normalizeTabConfig(cfg));
  EFFECTIVE_NAV_GROUPS = computeEffectiveNavGroups(tabConfig);
  TAB_TO_GROUP = buildTabToGroup(EFFECTIVE_NAV_GROUPS);
  renderSidebarNav();
}

/** 仅持久化本功能自身的配置 */
async function persistTabConfig(cfg){
  await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ admin_tab_config: JSON.stringify(cfg) }) });
}

/** 首个可见标签（当前标签被隐藏时用于回退） */
function firstEffectiveTab(){
  for (const g of EFFECTIVE_NAV_GROUPS){
    if (g.tab) return g.tab;
    if (g.subs && g.subs.length) return g.subs[0].tab;
  }
  return 'settings';
}

/** 侧边栏导航 HTML */
function sidebarHtmlFor(groups){
  return groups.map(g => {
    const isSingle = !g.subs;
    const active = (isSingle && currentTab === g.tab) || TAB_TO_GROUP[currentTab] === g.key;
    const subHtml = g.subs ? `
      <div class="sb-sub ${active ? 'open' : ''}" data-sub="${g.key}">
        ${g.subs.map(s => `
          <button data-tab="${s.tab}" class="${currentTab === s.tab ? 'active' : ''}">
            <span class="ic">${s.ic}</span>${esc(s.label())}
          </button>`).join('')}
      </div>` : '';
    return `
      <button class="sb-main ${active ? 'open' : ''} ${isSingle ? 'single' : ''}" data-group="${g.key}" data-tab="${g.tab || ''}">
        <span class="ic">${g.ic}</span>${esc(g.label())}
        ${g.subs ? '<span class="chev">▶</span>' : ''}
      </button>
      ${subHtml}`;
  }).join('');
}

/** 重渲染侧边栏（配置变更后调用；事件为委托绑定，无需重新绑定） */
function renderSidebarNav(){
  const sidebar = $('#sidebar');
  if (!sidebar) return;
  sidebar.innerHTML = sidebarHtmlFor(EFFECTIVE_NAV_GROUPS);
  highlightSidebar(currentTab);
}

/** 更新侧边栏高亮与展开状态 */
function highlightSidebar(tab){
  const sidebar = $('#sidebar');
  if (!sidebar) return;
  sidebar.querySelectorAll('.sb-main').forEach(m => {
    const gKey = m.dataset.group;
    const g = EFFECTIVE_NAV_GROUPS.find(x => x.key === gKey);
    if (!g) return;
    const isSingle = !g.subs;
    const isActive = (isSingle && g.tab === tab) || TAB_TO_GROUP[tab] === gKey;
    m.classList.toggle('open', isActive);
    m.classList.toggle('active', isActive && isSingle);
    const sub = sidebar.querySelector('.sb-sub[data-sub="' + gKey + '"]');
    if (sub) sub.classList.toggle('open', isActive);
  });
  sidebar.querySelectorAll('.sb-sub button[data-tab]').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab)
  );
}

async function showApp(prefetchedSession){
  loginStage = 'password'; savedLoginKey = '';

    // 复用启动时已拿到的 session（避免重复请求）；登录/2FA 成功后无缓存则自行拉取
    const s = prefetchedSession || await api('/api/admin/session');
    siteTitle = s.site_title || siteTitle;
    // 上传能力：大文件分片开关 + 存储后端类型（文件页据此决定 >100MB 是否可传）
    UPLOAD_CAPS.bigEnabled = !!s.big_upload_enabled;
    UPLOAD_CAPS.backend = s.storage_provider || 'r2';
    // 应用后台标签页自定义配置（#sidebar 尚未渲染，此时仅更新内存状态）
    applyTabConfig(normalizeTabConfig(parseStoredTabConfig(s.admin_tab_config)));
    // 隐藏路由：访问 /admin/apple 强制 Apple 玻璃风格（暗色紫蓝渐变）
    const path = location.pathname;
    if (/\/admin\/apple(\/|$)/.test(path)) {
      document.documentElement.dataset.theme = 'apple-dark';
    } else {
      // 根据后端偏好设置主题（默认 dark）
      document.documentElement.dataset.theme = s.ui_theme === 'light' ? 'light' : 'dark';
    }
  }catch{
    // 兜底
    document.documentElement.dataset.theme = location.pathname.includes('/admin/apple') ? 'apple-dark' : 'dark';
  }
  document.title = t('docTitle', {site: siteTitle});

  // 渲染侧边栏（依据已应用的标签页配置）
  const sidebarHtml = sidebarHtmlFor(EFFECTIVE_NAV_GROUPS);

  $('#app').innerHTML = `
  <div class="wrap">

        <span id="pill-text">— / —</span>
      </div>
      <button class="btn sm" id="theme-toggle" title="🌙 / ☀️" style="font-size:16px;padding:9px 11px;line-height:1">${document.documentElement.dataset.theme === 'light' ? '🌙' : '☀️'}</button>
      <button class="btn sm" id="lang-btn">${esc(t('switchTo'))}</button>
      <button class="btn sm" id="logout-btn">${esc(t('logout'))}</button>
    </div>
    <div class="layout">
      <nav class="sidebar" id="sidebar">${sidebarHtml}</nav>
      <div id="view"></div>
    </div>
  </div>`;

  // 绑定侧边栏事件
  $('#sidebar').addEventListener('click', e => {
    const main = e.target.closest('.sb-main');
    if (main) {
      const gKey = main.dataset.group;
      const tab = main.dataset.tab;
      if (tab) {
        // 叶子节点（如 overview）：直接切换
        switchTab(tab);
      } else {
        // 有子菜单的：切换展开/收起
        const sub = $('#sidebar .sb-sub[data-sub="' + gKey + '"]');
        main.classList.toggle('open');
        sub?.classList.toggle('open');
        openGroup = main.classList.contains('open') ? gKey : null;
      }
      return;
    }
    const subBtn = e.target.closest('.sb-sub button[data-tab]');
    if (subBtn) switchTab(subBtn.dataset.tab);
  });

  $('#logout-btn').onclick = async () => { await api('/api/admin/logout', {method:'POST'}); showLogin(); };
  $('#traffic-pill').onclick = () => switchTab('settings');

  $('#theme-toggle').onclick = async () => {
    // Apple 主题下（隐藏路由）不允许切换
    const currentTheme = document.documentElement.dataset.theme;
    if (currentTheme === 'apple' || currentTheme === 'apple-dark') return;
    const next = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    $('#theme-toggle').textContent = next === 'light' ? '🌙' : '☀️';
    try { await api('/api/admin/settings', { method:'PUT', body: JSON.stringify({ ui_theme: next }) }); } catch {}

/* ═══════════ 大文件分片上传 ═══════════
 * Workers 平台单请求体硬上限 100MB：
 *   ≤64MB   → 原有单请求直传 /api/admin/upload（不变）
 *   >64MB   → 浏览器切片逐片 PUT /api/admin/upload/part，存储端 Multipart 组装
 * 开关在设置页「存储后端」分组；后端为 WebDAV 或开关关闭时 >100MB 拒绝。
 */
const UPLOAD_SINGLE_MAX = 64 * 1024 * 1024;   // 超过该阈值走分片
const UPLOAD_PART_RETRIES = 3;                // 单个分片失败重试次数
const UPLOAD_CAPS = { bigEnabled: false, backend: 'r2' };  // 登录/保存设置时由后端刷新
const chunkSupported = () => UPLOAD_CAPS.bigEnabled && UPLOAD_CAPS.backend !== 'webdav';

function uploadFiles(files){
  for(const file of files){
    if(file.size > 100 * 1024 * 1024 && !chunkSupported()){
      toast(t(UPLOAD_CAPS.bigEnabled ? 'backendNoBig' : 'bigUploadOff', {name: file.name}), 'err');
      continue;
    }
    const item = document.createElement('div');
    item.className = 'upload-item glass';
    item.innerHTML = `${ficon(file.name)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(file.name)}</span>
      <div class="prog"><i></i></div><span class="pct">0%</span>`
      + (file.size > UPLOAD_SINGLE_MAX && chunkSupported()
          ? `<button class="btn sm danger" style="padding:2px 10px;font-size:12px;flex:none" title="${esc(t('cancel'))}">✕</button>`
          : '');
    $('#upload-list').prepend(item);
    if(file.size > UPLOAD_SINGLE_MAX && chunkSupported()){
      uploadChunked(file, item, item.querySelector('button'));
    } else {
      uploadSingle(file, item);
    }
  }
}

/* ≤64MB：单请求直传（保持原逻辑） */
function uploadSingle(file, item){
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/admin/upload');
  xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
  xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
  xhr.upload.onprogress = e => {
    const pct = Math.round(e.loaded / e.total * 100);
    item.querySelector('.prog i').style.width = pct + '%';
    item.querySelector('.pct').textContent = pct + '%';
  };
  xhr.onload = () => {
    if(xhr.status === 201){ item.querySelector('.pct').textContent = t('uploadDone'); toast(t('uploadOk', {name: file.name})); loadFiles(); }
    else { item.querySelector('.pct').textContent = t('uploadFailShort'); toast(t('uploadFail', {name: file.name}), 'err'); }
  };
  xhr.onerror = () => { item.querySelector('.pct').textContent = t('uploadFailShort'); toast(t('uploadFail', {name: file.name}), 'err'); };
  xhr.send(file);
}

/* 单个分片 PUT（XHR 以拿到上传进度）；resolve etag */
function putPart(key, uploadId, partNumber, blob, onprogress, registerXhr){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    registerXhr(xhr);
    xhr.open('PUT', `/api/admin/upload/part?key=${encodeURIComponent(key)}&uploadId=${encodeURIComponent(uploadId)}&partNumber=${partNumber}`);
    xhr.upload.onprogress = e => { if(e.lengthComputable) onprogress?.(e.loaded); };
    xhr.onload = () => {
      let data = null;
      try{ data = JSON.parse(xhr.responseText); }catch{}
      if(xhr.status === 200 && data?.etag) resolve(data.etag);
      else reject(new Error(data?.error || `HTTP ${xhr.status}`));
    };
    xhr.onerror = () => reject(new Error('network error'));
    xhr.send(blob);
  });
}

/* >64MB：分片上传主流程 init → 逐片 PUT（失败重试）→ complete；失败/取消时 abort 清理孤儿分片 */
async function uploadChunked(file, item, cancelBtn){
  const setPct = pct => {
    item.querySelector('.prog i').style.width = Math.min(100, Math.max(0, pct)) + '%';
    item.querySelector('.pct').textContent = Math.min(100, Math.max(0, Math.round(pct))) + '%';
  };
  let aborted = false, activeXhr = null;
  const session = { key: '', uploadId: '' };

  const cleanupSession = async () => {
    if(!session.key || !session.uploadId) return;
    try{ await api('/api/admin/upload/abort', { method:'POST', body: JSON.stringify({key: session.key, uploadId: session.uploadId}) }); }catch{}
  };
  if(cancelBtn) cancelBtn.onclick = () => { aborted = true; try{ activeXhr?.abort(); }catch{} };

  try{
    // ① 初始化：后端创建 Multipart 会话
    const init = await api('/api/admin/upload/init', {
      method:'POST',
      body: JSON.stringify({ name: file.name, mime: file.type || 'application/octet-stream', size: file.size })
    });
    if(aborted){ await cleanupSession(); return; }
    session.key = init.key;
    session.uploadId = init.uploadId;
    const partSize = Number(init.partSize) > 0 ? Number(init.partSize) : 25 * 1024 * 1024;
    const partPct = partSize / file.size * 100;   // 每片占进度条的比例
    const parts = [];
    let offset = 0, partNumber = 1;
    // ② 逐片上传（串行，单片失败退避重试）
    while(offset < file.size){
      if(aborted){ await cleanupSession(); item.querySelector('.pct').textContent = t('uploadFailShort'); toast(t('uploadAborted', {name: file.name})); return; }
      const end = Math.min(offset + partSize, file.size);
      const blob = file.slice(offset, end);
      const basePct = offset / file.size * 100;
      let etag = null;
      for(let attempt = 0; ; attempt++){
        try{
          etag = await putPart(session.key, session.uploadId, partNumber, blob,
            loaded => setPct(basePct + (loaded / blob.size) * partPct),
            xhr => { activeXhr = xhr; });
          break;
        }catch(err){
          if(aborted){ await cleanupSession(); return; }
          if(attempt >= UPLOAD_PART_RETRIES) throw err;
          toast(t('partRetry', {name: file.name, n: partNumber}));
          await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));  // 线性退避
        }
      }
      parts.push({ partNumber, etag });
      offset = end; partNumber++;
    }
    // ③ 组装 + 落库
    if(aborted){ await cleanupSession(); return; }
    setPct(100);
    await api('/api/admin/upload/complete', {
      method:'POST',
      body: JSON.stringify({ key: session.key, uploadId: session.uploadId, name: file.name, mime: file.type || 'application/octet-stream', parts })
    });
    item.querySelector('.pct').textContent = t('uploadDone');
    toast(t('uploadOk', {name: file.name}));
    loadFiles();
  }catch(err){
    // 失败：放弃会话清理孤儿分片（后端 complete 失败也会自行 abort，这里是取消/网络断连场景）
    await cleanupSession();
    if(!aborted){
      item.querySelector('.pct').textContent = t('uploadFailShort');
      toast(t('uploadFail', {name: file.name}), 'err');
    }
  }
}

/* ═══════════ 存储浏览（S3 / R2） ═══════════ */
let _stgPrefix = '';
let _stgMarker = undefined;
async function loadStorage(){
  const isZh = LANG === "zh";
  const getView = () => document.getElementById('view');

  function breadcrumbs(prefix){
    const parts = prefix ? prefix.split('/').filter(Boolean) : [];
    const arr = [{ name: isZh ? '根目录' : 'Root', prefix: '' }];
    let acc = '';
    for (const p of parts){
      acc += p + '/';
      arr.push({ name: p, prefix: acc });
    }
    return arr;
  }

  async function render(){
    const view = getView();
    if (!view) return;
    view.innerHTML = `<div class="spin"></div>`;
    try{
      const url = `/api/admin/storage/objects?prefix=${encodeURIComponent(_stgPrefix || '')}${_stgMarker ? '&marker=' + encodeURIComponent(_stgMarker) : ''}&limit=100`;
      const r = await api(url);
      const kind = r.kind === 'r2' ? 'R2' : r.kind === 'webdav' ? 'WebDAV' : 'S3';
      const bc = breadcrumbs(_stgPrefix);

      const bcHtml = bc.map((part, i) => {
        const isLast = i === bc.length - 1;
        const label = esc(part.name);
        if (isLast) return `<span style="font-family:ui-monospace,monospace">${label}</span>`;
        return `<a href="javascript:void(0)" data-prefix="${esc(part.prefix)}" class="stg-bc" style="color:var(--blue);text-decoration:none;font-family:ui-monospace,monospace">${label}</a>`;
      }).join('<span style="opacity:.35;margin:0 6px">/</span>');

      const rows = [...(r.entries ?? [])].sort((a,b)=>{
        if(a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      let html2 = `
        <div class="glass group" style="padding:18px 22px">
          <div class="row" style="gap:12px;flex-wrap:wrap">
            <div style="flex:1;min-width:260px">
              <div style="font-size:13px;opacity:.6;margin-bottom:4px">${isZh ? '当前路径' : 'Current path'}</div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span style="opacity:.5">${kind}</span>
                <span style="opacity:.35">·</span>
                ${bcHtml}
              </div>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn sm" id="stg-refresh">🔄 ${isZh?'刷新':'Refresh'}</button>
              <button class="btn sm danger" id="stg-delete-sel">🗑️ ${isZh ? '删除选中' : 'Delete Selected'}</button>
            </div>
          </div>
        </div>
        <div class="glass group" style="padding:0;overflow:auto">
          <table class="tbl" style="margin:0">
            <thead><tr>
              <th style="width:36px"><input type="checkbox" id="stg-check-all"></th>
              <th>${esc(t('colName'))}</th>
              <th style="width:120px">${esc(t('colSize'))}</th>
              <th style="width:170px">${esc(t('colTime'))}</th>
              <th style="width:140px">${esc(t('colActions'))}</th>
            </tr></thead>
            <tbody id="stg-tbody">
      `;
      if (rows.length === 0){
        html2 += `<tr><td colspan="5" style="text-align:center;padding:48px;opacity:.6">${isZh ? '此目录为空' : 'This directory is empty'}</td></tr>`;
      } else {
        html2 += rows.map(e => {
          const rowKey = esc(e.key);
          if (e.isDir){
            return `<tr data-key="${rowKey}">
              <td></td>
              <td><a href="javascript:void(0)" class="stg-dir" data-prefix="${esc(e.key)}" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:8px">📁 <strong>${esc(e.name.replace(/\/$/, ''))}</strong></a></td>
              <td style="opacity:.35">—</td>
              <td style="opacity:.35">—</td>
              <td></td>
            </tr>`;
          }
          const icon = ficon(e.name);
          return `<tr data-key="${rowKey}">
            <td><input type="checkbox" class="stg-chk"></td>
            <td style="display:flex;align-items:center;gap:10px">${icon}<span style="font-family:ui-monospace,monospace">${esc(e.name)}</span></td>
            <td class="num">${fmtSize(e.size)}</td>
            <td class="num" style="white-space:nowrap">${e.lastModified ? fmtTime(e.lastModified) : '—'}</td>
            <td style="white-space:nowrap">
              <button class="btn sm" data-copy-key="${rowKey}">${isZh ? '复制Key' : 'Copy Key'}</button>
            </td>
          </tr>`;
        }).join('');

        </div>

      `;

          render();

      document.getElementById('stg-delete-sel')?.addEventListener('click', async () => {
        const keys = [...document.querySelectorAll('.stg-chk:checked')].map(c => c.closest('tr')?.dataset.key).filter(Boolean);

        if (!(await confirmDialog(
          isZh ? `删除 ${keys.length} 个对象？` : `Delete ${keys.length} objects?`,
          isZh ? '此操作会直接从存储中删除对象，数据库文件记录不受影响。不可恢复。' : 'This removes objects directly from storage. DB file records are not affected. Cannot be undone.',
          true
        ))) return;
        try{
          const r2 = await api('/api/admin/storage/objects', { method:'DELETE', body: JSON.stringify({ keys }) });
          toast((isZh ? '已删除 {n} 个对象' : 'Deleted {n} objects').replace('{n}', r2.deleted));
          _stgMarker = undefined;
          render();
        }catch(e2){ toast(e2.message, 'err'); }
      });
    }catch(e){
      const v3 = getView();
      if (v3) v3.innerHTML = `<div class="glass group" style="padding:32px;text-align:center;opacity:.85">
        <div style="font-size:18px;font-weight:600;margin-bottom:8px">${isZh ? '存储浏览暂不可用' : 'Storage browser unavailable'}</div>
        <div style="font-size:13px;opacity:.7">${esc(e.message || e)}</div>
      </div>`;
    }
  }
  render();
}

/** 绑定卡片上的事件（保存 / 绑定 / 解绑 / 启用） */
function bindLoginMethodCard(p){
  const name = p.name;
  const id = p.id;
  const card = document.querySelector(`[data-provider="${id}"]`);
  if(!card) return;

  // 保存 OAuth 应用配置（Secret 留空 = 保留现有值）
  card.querySelector('[data-a="save"]')?.addEventListener('click', async () => {
    const body = { provider: id, client_id: card.querySelector('[data-f="client-id"]').value.trim() };
    const sec = card.querySelector('[data-f="client-secret"]').value.trim();
    if(sec) body.client_secret = sec;
    try{
      await api('/api/admin/login-methods', { method:'PUT', body: JSON.stringify(body) });
      toast(t('lmSaved')); loadAdminLogins();
    }catch(e){ toast(e.message || t('lmErrGeneric'), 'err'); }
  });
  // 绑定 —— 跳转第三方授权
  card.querySelector('[data-a="bind"]')?.addEventListener('click', async () => {
    try{
      const r = await api('/api/admin/login-methods/bind-start', { method:'POST', body: JSON.stringify({ provider: id }) });
      if(r.authorize_url) location.href = r.authorize_url;
      else toast(t('lmNeedConfig'), 'err');
    }catch(e){ toast(e.message || t('lmNeedConfig'), 'err'); }
  });
  // 解绑
  card.querySelector('[data-a="unbind"]')?.addEventListener('click', async () => {
    if(!(await confirmDialog(t('lmConfirmUnbindT', {name}), t('lmConfirmUnbindD', {name})))) return;
    try{
      await api('/api/admin/login-methods/unbind', { method:'POST', body: JSON.stringify({ provider: id }) });
      toast(t('lmUnboundOk', {name})); loadAdminLogins();
    }catch(e){ toast(e.message || t('lmErrGeneric'), 'err'); }
  });
  // 启用/停用该登录方式
  card.querySelector('[data-a="enable"]')?.addEventListener('change', async (e) => {
    try{
      await api('/api/admin/login-methods', { method:'PUT', body: JSON.stringify({ provider: id, enabled: e.target.checked }) });
      toast(t('lmSaved'));
    }catch(err){
      e.target.checked = !e.target.checked;
      toast(err.message || t('lmLoginDisabledHint'), 'err');
    }
  });
}

/* ═══════════ 全球分布 —— ECharts 3D 地球仪 ═══════════ */
let echartsLoaded = false;

/** 动态加载 ECharts + echarts-gl（首次进入全球分布 Tab 时才加载） */
function ensureECharts(){
  if (echartsLoaded) return Promise.resolve();
  if (echartsLoadingPromise) return echartsLoadingPromise;
  echartsLoadingPromise = new Promise((resolve, reject) => {
    // 按顺序加载：echarts → echarts-gl。
    // 3D 地球仪（globe）使用贴图 + scatter3D，不再依赖任何地图 GeoJSON，
    // 因此这里不需要加载 world.js（少一次请求，也少一个可能失败的点）。
    const loadScript = (src, cb) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = cb;
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    };
    loadScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js', () => {
      loadScript('https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js', () => {
        echartsLoaded = true;
        resolve();
      });
    });
  });
  return echartsLoadingPromise;
}

/** 返回 { label: 'UTC+8', time: '当前当地时间 HH:MM' } */
function tzInfo(code, lng){
  const now = new Date();
  const zone = COUNTRY_TZ[code];
  if (zone) {
    try {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: zone, timeZoneName: 'shortOffset' }).formatToParts(now);
      const tzn = parts.find(p => p.type === 'timeZoneName');
      const label = tzn ? tzn.value.replace('GMT', 'UTC') : zone;
      const time = new Intl.DateTimeFormat('en-GB', { timeZone: zone, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
      return { label, time };
    } catch (_) { /* 回退到经度推算 */ }
  }
  const off = Math.max(-12, Math.min(14, Math.round((lng || 0) / 15)));
  const label = 'UTC' + (off >= 0 ? '+' : '-') + Math.abs(off);
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  const t = new Date(utcMs + off * 3600000);
  const time = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
  return { label, time };
}

/** 下载量热度 → 颜色（低=深蓝，高=浅蓝） */
function heatColor(t){
  t = Math.max(0, Math.min(1, t || 0));
  const stops = [[0,30,58,95],[0.25,37,99,235],[0.5,59,130,246],[0.75,96,165,250],[1,191,219,254]];
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const a = stops[i-1], b = stops[i];
      const k = (t - a[0]) / ((b[0] - a[0]) || 1);
      return `rgb(${Math.round(a[1]+(b[1]-a[1])*k)},${Math.round(a[2]+(b[2]-a[2])*k)},${Math.round(a[3]+(b[3]-a[3])*k)})`;
    }
  }
  return 'rgb(191,219,254)';
}

    <div class="stat-card glass" style="flex:1"><div class="label">${esc(t('globalTotalBytes'))}</div><div class="value">${fmtSize(data.totals?.bytes ?? 0)}</div></div>
    <div class="stat-card glass" style="flex:1"><div class="label">${esc(t('globalCountries'))}</div><div class="value">${data.totals?.countries_seen ?? 0}</div></div>
  `;

  // 空数据提示
  if (!countries.length) {
    if (globeChart) { try { globeChart.dispose(); } catch (_) {} globeChart = null; }
    $('#globe').innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:14px">${esc(t('globalEmpty'))}</div>`;
    $('#global-table-wrap').innerHTML = `<div class="empty"><div class="icon">🌍</div>${esc(t('globalEmpty'))}</div>`;
    return;
  }

  // 加载 ECharts
  try {
    await ensureECharts();
  } catch (err) {
    reportError({ source:'frontend', message: 'Failed to load chart library: ' + ((err && err.message) || err),
      stack: err && err.stack, context: 'echarts-gl/missing-library' });
    $('#globe').innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#ef4444;font-size:14px">Failed to load chart library</div>`;
    return;
  }

  // echarts-gl 的 3D 地球仪（globe）用 baseTexture 地球贴图 + scatter3D 点位系列，
  // 不再使用平面 map/geo 配置，也不再需要世界地图 GeoJSON。

  // cf-ipcountry 国家代码 → 大致经纬度（用于在球面定位散点）
  const approxGeo = {
    'US': [-97, 38], 'CN': [104, 35], 'JP': [138, 36], 'KR': [127, 36], 'GB': [-2, 54], 'DE': [10, 51],
    'FR': [2, 46], 'CA': [-106, 56], 'AU': [134, -25], 'BR': [-52, -15], 'IN': [78, 22], 'RU': [90, 62],
    'IT': [12, 42], 'ES': [-4, 40], 'NL': [5, 52], 'PL': [20, 52], 'TR': [35, 39], 'MX': [-102, 23],
    'AR': [-64, -34], 'ZA': [25, -29], 'SG': [104, 1], 'HK': [114, 22], 'TW': [121, 24], 'TH': [101, 15],
    'VN': [108, 16], 'ID': [113, -1], 'PH': [121, 12], 'MY': [101, 3], 'NZ': [174, -41], 'SE': [18, 62],
    'NO': [8, 61], 'FI': [26, 64], 'DK': [10, 56], 'CH': [8, 46], 'AT': [14, 48], 'BE': [5, 50],
    'IE': [-8, 53], 'PT': [-8, 39], 'GR': [22, 40], 'IL': [35, 31], 'AE': [54, 24], 'SA': [45, 24],
    'EG': [30, 26], 'NG': [8, 10], 'KE': [38, -1], 'CO': [-72, 4], 'CL': [-71, -30], 'PE': [-76, -10],
    'UA': [32, 49], 'CZ': [16, 49], 'HU': [19, 47], 'RO': [25, 46], 'BG': [25, 42], 'HR': [16, 45],
    'RS': [21, 44], 'SK': [19, 49], 'SI': [14, 46], 'LT': [24, 55], 'LV': [24, 56], 'EE': [26, 58],
    'IS': [-18, 64], 'LU': [6, 49], 'QA': [51, 25], 'KW': [47, 29], 'PK': [70, 30], 'BD': [90, 24],
    'LK': [81, 7], 'MM': [95, 21], 'KH': [105, 12],
  };
  const maxDownloads = Math.max(...countries.map(c => c.downloads), 1);

  // 组装地球仪数据（未知/未分类不落点）
  const globeData = countries
    .filter(c => c.country !== 'ZZ' && c.country !== 'XX' && approxGeo[c.country])
    .map(c => {
      const [lng, lat] = approxGeo[c.country];
      return {
        name: countryName(c.country),
        code: c.country,
        lng, lat,
        value: [lng, lat, c.downloads],
        downloads: c.downloads,
        bytes: c.bytes,
        unique_ips: c.unique_ips,
        unique_files: c.unique_files,
        itemStyle: { color: heatColor(c.downloads / maxDownloads) },
      };
    });

  // 重建前先销毁旧实例，避免重复 init 与 resize 监听泄漏
  if (globeChart) { try { globeChart.dispose(); } catch (_) {} globeChart = null; }

  const chart = echarts.init($('#globe'));
  const globeOption = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(15,22,41,0.94)',
      borderColor: 'rgba(99,179,237,0.4)',
      borderWidth: 1,
      padding: [10, 14],
      textStyle: { color: '#e2e8f0', fontSize: 13 },
      formatter: (p) => {
        const d = p.data || {};
        if (!d.code) return '';
        const tz = tzInfo(d.code, d.lng);
        return `<div style="font-weight:600;margin-bottom:6px">${esc(d.name)} <span style="color:#94a3b8;font-weight:400;font-size:11px">${esc(d.code)}</span></div>
          <div>${esc(t('globalDownloads'))}: <b>${d.downloads}</b></div>
          <div>${esc(t('globalBytes'))}: <b>${fmtSize(d.bytes)}</b></div>
          <div>${esc(t('globalUniqueIps'))}: <b>${d.unique_ips}</b></div>
          <div style="margin-top:5px;color:#93c5fd">🕒 ${esc(t('globalTimezone'))}: <b>${esc(tz.label)}</b> · ${esc(tz.time)}</div>`;
      }
    },
    globe: {
      // 贴图走本站 /assets/earth-day.jpg —— 由 Worker 内置并同源提供。
      // 之前用外部 CDN：部分网络环境下载失败时，echarts-gl 会退回渲染成纯白色球体（看着像月亮）。
      baseTexture: '/assets/earth-day.jpg',
      shading: 'color',      // 全表面均匀受光，整颗地球的陆地/海洋都清晰可见（不会有一半是暗的）
      environment: 'none',   // 不要天空盒 / 环境贴图，只要地球本身
      atmosphere: { show: true, color: '#3b82f6', glowPower: 4, innerGlowPower: 2 },
      viewControl: {
        autoRotate: false,       // 可随意拖动，松手后保持当前视角
        rotateSensitivity: 1,
        zoomSensitivity: 1.5,
        panSensitivity: 0,
      },
    },
    series: [{
      type: 'scatter3D',
      coordinateSystem: 'globe',
      name: LANG === 'zh' ? '下载分布' : 'Downloads',
      symbolSize: (val) => {
        const d = (val && val[2]) || 0;
        return Math.max(7, Math.min(34, 7 + Math.sqrt(d / maxDownloads) * 27));
      },
      itemStyle: {
        opacity: 0.92,
        borderWidth: 1,
        borderColor: 'rgba(255,255,255,0.6)',
      },
      data: globeData,
      emphasis: { itemStyle: { opacity: 1 } },
    }],
  };
  // setOption 会实例化 echarts-gl 的 ViewGL（内部用 new Function 编译 'expr(...)' 表达式）。
  // 若 CSP 缺 'unsafe-eval' 会抛 "Invalid expression." —— 这里捕获后上报错误日志并降级提示。
  let globeOk = true;
  try {
    chart.setOption(globeOption);
  } catch (err) {
    globeOk = false;
    reportError({ source:'frontend', message: 'Globe render failed: ' + ((err && err.message) || err),
      stack: err && err.stack, context: 'echarts-gl/globe' });
    $('#globe').innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#ef4444;font-size:13px;padding:0 16px;text-align:center">${esc((err && err.message) || 'Chart render failed')}</div>`;
  }
  if (globeOk) {
    globeChart = chart;
    if (window.__globeResize) window.removeEventListener('resize', window.__globeResize);
    window.__globeResize = () => { try { chart.resize(); } catch (_) {} };
    window.addEventListener('resize', window.__globeResize);
  }

  // 国家排行表格
  const rows = countries.slice(0, 20).map(c => {
    const pct = Math.round((c.downloads / maxDownloads) * 100);
    const g = approxGeo[c.country];
    const z = tzInfo(c.country, g ? g[0] : 0);
    return `<tr>
      <td>${countryName(c.country)} <span style="color:var(--text-3);font-size:11px">${c.country}</span></td>
      <td class="num">${c.downloads}</td>
      <td class="num">${fmtSize(c.bytes)}</td>
      <td class="num">${c.unique_ips}</td>
      <td class="num" style="white-space:nowrap">${esc(z.label)} <span style="color:var(--text-3)">${esc(z.time)}</span></td>
      <td><div class="progress"><i style="width:${pct}%;background:linear-gradient(90deg,#2563eb,#60a5fa)"></i></div></td>
    </tr>`;
  }).join('');
  $('#global-table-wrap').innerHTML = `
    <div class="glass section" style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0;font-size:14px;color:var(--text-2)">${LANG==='zh'?'国家/地区排行 · Top 20':'Top 20 Countries'}</h3>
        <span style="color:var(--text-3);font-size:12px">${esc(t('globalGeoSource'))}</span>
      </div>
      <table class="tbl">
        <thead><tr>
          <th>${esc(t('globalCountry'))}</th>
          <th>${esc(t('globalDownloads'))}</th>
          <th>${esc(t('globalBytes'))}</th>
          <th>${esc(t('globalUniqueIps'))}</th>
          <th>${esc(t('globalTimezone'))}</th>
          <th>%</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

/* ═══════════ 激活码管理 ═══════════ */
let codesPage = 1;
let codesStatus = '';
let codesBatchId = '';
let codesPlan = '';
let codesQ = '';

async function loadCodes(){
  const [usage, batches] = await Promise.all([
    api('/api/admin/codes/usage'),
    api('/api/admin/codes/batches').catch(() => ({batches: []})),
  ]);
  const sum = usage.summary || {};
  const batchesList = usage.batches || [];
  const batchOptions = (batches.batches || batchesList.map(b => ({batch_id: b.batch_id, count: b.n || b.count})));
  const plans = [...new Set(batchOptions.map(b => b.batch_id))];

  const totalCodes = sum.total || 0;
  const usedCodes = (sum.active||0) + (sum.exhausted||0) + (sum.expired||0);
  const totalTrafficGB = ((sum.total_bytes||0) / 1024 / 1024 / 1024).toFixed(2);
  const usedTrafficGB = ((sum.used_bytes||0) / 1024 / 1024 / 1024).toFixed(2);
  const trafficPct = sum.total_bytes > 0 ? Math.round((sum.used_bytes / sum.total_bytes) * 100) : 0;

  const v = $('#view');
  v.innerHTML = `
    <div class="glass section">
      <div class="section-title">
        <h2>🎟️ ${esc(t('codesTitle'))}</h2>
      </div>
      <div class="sub" style="color:var(--text-2);font-size:13px;margin-bottom:14px">${esc(t('codesSub'))}</div>

      <!-- 用量概览 -->
      <div class="stats-row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px">
        <div class="stat-box" style="background:rgba(255,255,255,.06);border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesColCode'))} / Total</div>
          <div style="font-size:22px;font-weight:700;margin-top:4px">${totalCodes}</div>
        </div>
        <div class="stat-box" style="background:rgba(255,255,255,.06);border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesStatusUnused'))}</div>
          <div style="font-size:22px;font-weight:700;margin-top:4px;color:#34d399">${sum.unused||0}</div>
        </div>
        <div class="stat-box" style="background:rgba(255,255,255,.06);border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesStatusActive'))}</div>
          <div style="font-size:22px;font-weight:700;margin-top:4px;color:#60a5fa">${sum.active||0}</div>
        </div>
        <div class="stat-box" style="background:rgba(255,255,255,.06);border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesColTraffic'))}</div>
          <div style="font-size:18px;font-weight:700;margin-top:4px">${usedTrafficGB} / ${totalTrafficGB} GB</div>
          <div style="margin-top:6px;height:4px;background:var(--track-bg);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${trafficPct}%;background:linear-gradient(90deg,#34d399,#60a5fa);border-radius:2px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 批量生成 -->
    <div class="glass section">
      <div class="section-title">
        <h2>⚡ ${esc(t('codesGenerateTitle'))}</h2>
      </div>
      <div id="codes-gen-form" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
        <div class="field" style="margin:0">
          <label>${esc(t('codesCount'))}</label>
          <input type="number" id="cg-count" min="1" max="10000" value="100">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesTraffic'))}</label>
          <input type="number" id="cg-traffic" min="0" value="10">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesDays'))}</label>
          <input type="number" id="cg-days" min="0" value="30">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesPlanName'))}</label>
          <input type="text" id="cg-plan" placeholder="Pro / Basic / ...">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesNotes'))}</label>
          <input type="text" id="cg-notes" placeholder="">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesQuotaMsg'))}</label>
          <input type="text" id="cg-msg" placeholder="">
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" id="cg-do">${esc(t('codesGenerate'))}</button>
      </div>
      <div id="cg-preview" style="margin-top:14px"></div>
    </div>

    <!-- 列表 -->
    <div class="glass section">
      <div class="section-title">
        <h2>📋 ${esc(t('codesListTitle'))} <span id="codes-total-count" style="color:var(--text-3);font-weight:400;font-size:13px"></span></h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select id="cf-status" style="padding:8px 12px;border-radius:10px;background:var(--sf-input);border:1px solid var(--stroke-strong);color:var(--text);font-size:13px;font-family:inherit;outline:none">
            <option value="">${esc(t('codesFilterAll'))} ${esc(t('codesFilterStatus'))}</option>
            <option value="unused">${esc(t('codesStatusUnused'))}</option>
            <option value="active">${esc(t('codesStatusActive'))}</option>
            <option value="expired">${esc(t('codesStatusExpired'))}</option>
            <option value="exhausted">${esc(t('codesStatusExhausted'))}</option>
            <option value="revoked">${esc(t('codesStatusRevoked'))}</option>
          </select>
          <select id="cf-batch" style="padding:8px 12px;border-radius:10px;background:var(--sf-input);border:1px solid var(--stroke-strong);color:var(--text);font-size:13px;font-family:inherit;outline:none">
            <option value="">${esc(t('codesFilterAll'))} ${esc(t('codesFilterBatch'))}</option>
            ${batchOptions.map(b => `<option value="${esc(b.batch_id)}">${esc(b.batch_id)} (${b.count||b.n||0})</option>`).join('')}
          </select>
          <input type="text" id="cf-q" placeholder="${esc(t('codesFilterQ'))}" value="${esc(codesQ)}" style="padding:8px 12px;border-radius:10px;background:var(--sf-input);border:1px solid var(--stroke-strong);color:var(--text);font-size:13px;font-family:inherit;outline:none;width:180px">
          <button class="btn sm" id="cf-export">${esc(t('codesExportCsv'))}</button>
          <button class="btn sm danger" id="cf-revoke-batch">${esc(t('codesRevokeBatch'))}</button>
        </div>
      </div>
      <div id="codes-table"></div>
      <div id="codes-pg" style="margin-top:14px;display:flex;justify-content:center;gap:10px"></div>
    </div>
  `;

  // 生成按钮
  $('#cg-do').onclick = async () => {
    const count = Math.max(1, Math.min(10000, Number($('#cg-count').value) || 100));
    const traffic = Math.max(0, Number($('#cg-traffic').value) || 0);
    const days = Math.max(0, Number($('#cg-days').value) || 0);
    if (traffic === 0 && days === 0) { toast('Set at least traffic OR days', 'err'); return; }
    try {
      const r = await api('/api/admin/codes/generate', { method:'POST', body: JSON.stringify({
        count, traffic_bytes: traffic * 1024 * 1024 * 1024, days_valid: days,
        plan_name: $('#cg-plan').value.trim() || undefined,
        quota_message: $('#cg-msg').value.trim() || undefined,
        notes: $('#cg-notes').value.trim() || undefined,
      })});
      toast(t('codesGeneratedN', {n: r.count}));
      const preview = r.codes || [];
      $('#cg-preview').innerHTML = `
        <div style="color:var(--text-3);font-size:12px;margin-bottom:6px">${esc(t('codesGeneratedPreview'))}</div>
        <div style="background:rgba(0,0,0,.3);border-radius:12px;padding:12px;font-family:ui-monospace,'SF Mono',monospace;font-size:12px;color:#fde68a;line-height:1.7;max-height:200px;overflow:auto">
          ${preview.map(c => `<div>${esc(c)}</div>`).join('')}
        </div>
      `;
      codesPage = 1;
      loadCodesList();
    } catch(err) { toast(err.message, 'err'); }
  };

  // 过滤器
  $('#cf-status').onchange = () => { codesStatus = $('#cf-status').value; codesPage = 1; loadCodesList(); };
  $('#cf-batch').onchange = () => { codesBatchId = $('#cf-batch').value; codesPage = 1; loadCodesList(); };
  $('#cf-q').addEventListener('input', (e) => {
    clearTimeout(window.__codesQ_t);
    window.__codesQ_t = setTimeout(() => { codesQ = e.target.value.trim(); codesPage = 1; loadCodesList(); }, 300);
  });

  // CSV 导出
  $('#cf-export').onclick = () => {
    const sp = new URLSearchParams();
    sp.set('export', '1');
    if (codesStatus) sp.set('status', codesStatus);
    if (codesBatchId) sp.set('batch_id', codesBatchId);
    if (codesQ) sp.set('q', codesQ);
    location.href = '/api/admin/codes?' + sp.toString();
  };

  // 按批次作废
  $('#cf-revoke-batch').onclick = async () => {
    if (!codesBatchId) { toast('Select a batch first', 'err'); return; }
    if (!(await confirmDialog(t('codesConfirmRevokeT'), t('codesConfirmRevokeD') + ' Batch: ' + codesBatchId, true))) return;
    try {
      const r = await api('/api/admin/codes/batch-revoke', { method:'POST', body: JSON.stringify({ batch_id: codesBatchId }) });
      toast(t('codesBatchRevokeOk', {n: r.updated || r.count || 0}));
      loadCodes();
    } catch(err) { toast(err.message, 'err'); }
  };

  // 自动选中第一个有效批次（如果还没选），让"按批次作废"等操作立即可用
  if (!codesBatchId && batchOptions.length > 0) {
    codesBatchId = batchOptions[0].batch_id;
    const sel = $('#cf-batch');
    if (sel) sel.value = codesBatchId;
  }

  loadCodesList();
}

async function loadCodesList(){

  params.set('page', codesPage);
  params.set('size', 50);
  if (codesStatus) params.set('status', codesStatus);
  if (codesBatchId) params.set('batch_id', codesBatchId);
  if (codesPlan) params.set('plan', codesPlan);

    const d = await api('/api/admin/codes?' + params.toString());
    $('#codes-total-count').textContent = `(${d.total})`;

      $('#codes-table').innerHTML = `<div class="empty"><div class="icon">🎟️</div>${esc(t('codesNoCodes'))}</div>`;

            <th style="padding:10px 8px">${esc(t('codesColTraffic'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColStatus'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColActivated'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColActions'))}</th>

        </thead>
        <tbody>

              <td style="padding:10px 8px;color:var(--text-2)">${esc(r.plan_id||'—')}</td>
              <td style="padding:10px 8px;color:var(--text-2)">${esc(r.batch_id||'—')}</td>
              <td style="padding:10px 8px">
                <div>${usedGB} / ${trafficGB}</div>
                ${r.traffic_bytes > 0 ? `<div style="margin-top:4px;height:3px;background:var(--track-bg);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#34d399,#60a5fa);border-radius:2px"></div></div>` : ''}
              </td>
              <td style="padding:10px 8px"><span style="color:${statusColor[r.status]||'#fff'}">${esc(statusLabel[r.status]||r.status)}</span></td>
              <td style="padding:10px 8px;color:var(--text-2)">${fmtTime(r.activated_at)}</td>
              <td style="padding:10px 8px">
                <button class="btn sm" data-query="${esc(r.code)}">${esc(t('codesQueryRemainBtn'))}</button>
                ${r.status !== 'revoked' ? `<button class="btn sm danger" data-revoke="${esc(r.id)}">${esc(t('codesRevokeOne'))}</button>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    `;

    // 行事件
    $$('#codes-table [data-revoke]').forEach(btn => btn.onclick = async () => {
      if (!(await confirmDialog(t('codesConfirmRevokeT'), t('codesConfirmRevokeD'), true))) return;
      try {
        await api('/api/admin/codes/' + btn.dataset.revoke + '/revoke', { method:'POST' });
        toast('OK');
        loadCodesList();
      } catch(err) { toast(err.message, 'err'); }
    });
    $$('#codes-table [data-query]').forEach(btn => btn.onclick = async () => {
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(btn.dataset.query));
        const d = await r.json();
        if (!r.ok) { toast(d.message || t('codesQueryNotFound'), 'err'); return; }
        const rem = d.status.remaining;
        const total = d.status.total;
        if (rem === -1) toast(t('codesQueryResultInfinite'));
        else toast(t('codesQueryResult', { remaining: fmtSize(rem), total: total > 0 ? fmtSize(total) : '∞' }));
      } catch(err) { toast(err.message, 'err'); }
    });

    // 分页
    const pages = Math.ceil(d.total / d.page_size);
    $('#codes-pg').innerHTML = pages > 1 ? `
      <button class="btn sm" ${d.page<=1?'disabled':''} id="pg-prev">${esc(t('prev'))}</button>
      <span style="font-size:13px;color:var(--text-2);align-self:center">${esc(t('pageOf', {a: d.page, b: pages}))}</span>
      <button class="btn sm" ${d.page>=pages?'disabled':''} id="pg-next">${esc(t('next'))}</button>
    ` : '';
    $('#pg-prev')?.addEventListener('click', () => { codesPage--; loadCodesList(); });
    $('#pg-next')?.addEventListener('click', () => { codesPage++; loadCodesList(); });
  } catch(err) { toast(err.message, 'err'); }
}

/* ── 后台标签页自定义 UI ── */
function tabCfgGroupDef(key){ return NAV_GROUPS.find(g => g.key === key); }
function tabCfgSubDef(tab){
  for (const g of NAV_GROUPS){ if (g.subs){ const s = g.subs.find(x => x.tab === tab); if (s) return s; } }
  return null;
}

function renderTabCfgSection(){
  return `
    <div class="glass group" id="tabcfg-group" style="margin-top:14px">
      <div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
